<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="firebase-config.js"></script>
<meta name="color-scheme" content="light dark">
<script>(function(){var t;try{t=localStorage.getItem("taller_theme")}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<title>Taller — Recepción y servicio técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f5f2;--surface:#fff;--ink:#17201a;--ink2:#3f4a42;--muted:#78827a;--line:#e3e6e0;--line2:#eef0ec;--soft:#f8f9f6;
  --pri:#15803d;--pri-d:#14532d;--pri-l:#dcfce7;--pri-50:#f0fdf4;
  --acc:#f59e0b;--acc-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;--blue:#2563eb;--blue-l:#dbeafe;
  --side:#0e1a13;--r:14px;--sh:0 1px 2px rgba(16,24,18,.05),0 1px 3px rgba(16,24,18,.06);--sh2:0 10px 30px rgba(16,24,18,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:24px;font-weight:800}h2{font-size:16px;font-weight:700}h3{font-size:14px;font-weight:700}
a{color:var(--pri)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--side);color:#cfd8d1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 18px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.bname{color:#fff;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bsub{font-size:11.5px;color:#7f9184}
.recv{margin:4px 14px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:11px;padding:11px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(21,128,61,.35)}
.recv:hover{background:#16a34a}
.nav{padding:0 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#56665a;padding:12px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:14px;font-weight:500;color:#aab7ad;transition:.12s}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(34,197,94,.14);color:#fff}
.nav button.on svg{color:#4ade80}
.nb{margin-left:auto;background:rgba(255,255,255,.1);color:#e5ece7;font-size:11px;padding:1px 8px;border-radius:20px;font-weight:600}
.sfoot{padding:14px 18px;font-size:11px;color:#56665a;border-top:1px solid rgba(255,255,255,.06)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(244,245,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 28px;min-height:62px}
.tsearch{position:relative;flex:1;max-width:460px}
.tsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tsearch input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.tsearch input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.mtitle{display:none}
.content{padding:24px 28px 110px;max-width:1440px;width:100%}
@media (min-width:1500px){.content{padding:28px 40px 110px}}
.status{display:none;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.status.warn{display:block;background:var(--acc-l);color:#854d0e}
.status.err{display:block;background:var(--red-l);color:var(--red)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:10px}
.back:hover{color:var(--ink)}
/* ---------- base ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cp-in{padding:18px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.ch h2{flex:1;display:flex;align-items:center;gap:8px}
.ch h2 svg{color:var(--pri)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:.12s}
.btn:hover{background:var(--soft);border-color:#cfd4cc}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:#16a34a}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.d{color:var(--red);border-color:#f5c2c2}.btn.d:hover{background:var(--red-l)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg.i{width:16px;height:16px}
.ib{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag.n{background:#dcfce7;color:#166534}.tag.u{background:#ffedd5;color:#9a3412}.tag.urg{background:var(--red-l);color:var(--red)}
.st-ok{background:#dcfce7;color:#166534}.st-low{background:#fef3c7;color:#92400e}.st-out{background:#fee2e2;color:#991b1b}
.num{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--pri);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:38px 16px}
.empty .ei{width:52px;height:52px;border-radius:14px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:24px;color:var(--muted)}
.empty b{display:block;color:var(--ink2);margin-bottom:4px}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;min-width:0}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.fbar .inp{flex:1;min-width:200px}
.seg{display:inline-flex;background:#e9ece6;border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.fchip{all:unset;cursor:pointer;flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.fchip .c{color:var(--muted);font-weight:500}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}.fchip.on .c{color:#c9d1cb}
/* list rows */
.rows{display:flex;flex-direction:column}
.rw{display:flex;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--pri-50)}
.rw .mn{flex:1;min-width:0}
.rw .t{font-weight:700}
.rw .m{color:var(--muted);font-size:13px}
.rw .r{text-align:right;flex-shrink:0;font-size:12.5px;color:var(--muted)}
.ticon{width:42px;height:42px;border-radius:11px;background:var(--pri-50);border:1px solid #d7ecd9;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#86efac,#15803d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.ck{cursor:pointer}table.t tbody tr.ck:hover{background:var(--pri-50)}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* stats */
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.12s}
.stat:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.stat .si{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .n{font-size:26px;font-weight:800;line-height:1.05}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
/* kv */
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0;word-break:break-word}
.lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.pillist{display:flex;flex-wrap:wrap;gap:6px}
.pl{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.pl.f{background:var(--acc-l);border-color:#fde68a;color:#854d0e}
.pl.w{background:var(--pri-50);border-color:#bbf7d0;color:#166534}
/* chips picker */
.cp{display:flex;flex-wrap:wrap;gap:7px}
.cpc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.1s;user-select:none}
.cpc:hover{border-color:#9fd3ad;background:var(--pri-50)}
.cpc.on{border-color:var(--pri);background:var(--pri);color:#fff}
.cpc.add{border-style:dashed;color:var(--pri);background:transparent}
.cpc .em{font-size:16px;line-height:1}
.cpadd{display:inline-flex;gap:6px;align-items:center}
.cpadd input{padding:7px 10px;border:1.5px solid var(--pri);border-radius:10px;outline:none;width:180px}
.cpfil{margin-bottom:8px;width:100%;max-width:280px}
.cpx{all:unset;cursor:pointer;margin-left:2px;opacity:.55;font-size:15px;line-height:1}.cpx:hover{opacity:1;color:var(--red)}
/* form */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>label,.fl{font-size:13px;font-weight:600;color:var(--ink2)}
.f>label .opt,.fl .opt{color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;outline:none}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.err{color:var(--red);font-size:13px;font-weight:600}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(10,18,12,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 14px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 56px);animation:pop .18s ease-out}
.mbox.lg{max-width:860px}.mbox.sm{max-width:440px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:.5}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.mh h2{flex:1;font-size:17px}
.mb{padding:20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* wizard */
.steps{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line2);overflow-x:auto}
.stp{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:5px 10px 5px 5px;border-radius:20px;flex-shrink:0}
.stp b{width:24px;height:24px;border-radius:50%;background:var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.stp.on{color:var(--ink);background:var(--pri-50)}.stp.on b{background:var(--pri);color:#fff}
.stp.ok b{background:var(--pri-l);color:var(--pri)}
.stp.dis{cursor:default;opacity:.6}
.sect{margin-bottom:22px}
.sect>.fl{display:block;margin-bottom:9px}
.pick{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;width:100%}
.pick:hover{border-color:#9fd3ad}
.pick.on{border-color:var(--pri);background:var(--pri-50)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.chosen{display:flex;gap:12px;align-items:center;border:1.5px solid var(--pri);background:var(--pri-50);border-radius:12px;padding:12px 14px}
.sum{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum>div{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.sum>div:last-child{border-bottom:0}
.sum dt{color:var(--muted)}
/* order */
.ohead{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.onum{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--muted)}
.otitle{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.pipe{display:flex;gap:4px;padding:0 20px 18px;overflow-x:auto}
.pp{all:unset;cursor:pointer;flex:1;min-width:92px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:10px;border-top:4px solid var(--line);transition:.12s}
.pp:hover{color:var(--ink)}
.pp.done{border-color:var(--pri);color:var(--pri)}
.pp.cur{border-color:var(--c);color:var(--c)}
.lines .ln{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.lines .ln:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.qty button:hover{background:var(--soft)}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:6px 18px 14px}
.tl li{position:relative;padding:8px 0 8px 24px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:4px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c,#9aa39c);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.tl li::after{content:"";position:absolute;left:8px;top:28px;bottom:-6px;width:2px;background:var(--line2)}
.tl li:last-child::after{display:none}
/* kanban */
.kb{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kc{flex:0 0 272px;background:#eceee9;border-radius:14px;padding:10px;min-height:120px}
.kc.over{outline:2px dashed var(--pri);outline-offset:-2px}
.kch{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:13px}
.kch .c{margin-left:auto;color:var(--muted);font-weight:600}
.kcard{background:#fff;border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;border:1px solid transparent}
.kcard:hover{border-color:#9fd3ad}
.kcard[draggable=true]{cursor:grab}
/* machine cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.12s}
.mcard:hover{border-color:#9fd3ad;box-shadow:var(--sh2)}
.last{font-size:12.5px;background:var(--acc-l);color:#854d0e;border-radius:8px;padding:6px 9px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:12px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri)}
.vis{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.vis .bx{font-size:13.5px;margin-top:6px}
.vis .bx b{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
/* role */
.role{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;border:0;white-space:nowrap}
.role.mec{background:var(--blue-l);color:#1e40af}.role.adm{background:var(--acc-l);color:#92400e}
.lockn{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px dashed #cfd4cc;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
mark{background:#fef08a;border-radius:3px;padding:0 1px}
.ckl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ckr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13.5px}
.ckr:last-child{border-bottom:0}.ckr>span{flex:1;min-width:0}
.ckb{display:inline-flex;gap:4px;flex-shrink:0}
.ckb button{all:unset;cursor:pointer;padding:4px 10px;border-radius:7px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.ckb button.on.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.ckb button.on.mal{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.ckb button.on.na{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.who{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.who .av{width:26px;height:26px;font-size:11px}
.who.none{border-style:dashed;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90;box-shadow:var(--sh2);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.bnav{display:none}
.no-recv [data-act=recibir],.no-recv [data-act=rRecibir],.no-recv [data-act=entregar]{display:none!important}
.no-taller [data-act=addRep],.no-taller [data-act=ppAdd][data-id],.no-taller .qty button,.no-taller [data-act=rmLine],.no-taller [data-act=tRecibir],.no-taller [data-act=listo]{display:none!important}
.more{display:none}
/* printable */
.pb{font:12.5px/1.45 "Plus Jakarta Sans",Arial,sans-serif;color:#111;background:#fff}
.pb .hd{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid #15803d;padding-bottom:12px;margin-bottom:14px}
.pb .hd img{height:60px;max-width:150px;object-fit:contain}
.pb .tn{font-size:17px;font-weight:800;color:#14532d}
.pb .nbx{border:2px solid #15803d;border-radius:10px;padding:6px 14px;text-align:center}
.pb .nbx small{display:block;font-size:9.5px;letter-spacing:.08em;color:#555}
.pb .nbx b{font:700 18px "JetBrains Mono",monospace;color:#14532d}
.pb h4{margin:12px 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#15803d}
.pb .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pb .bx{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.pb p{margin:2px 0}
.pb table{width:100%;border-collapse:collapse;font-size:12px}
.pb th{text-align:left;background:#f0fdf4;padding:5px 7px;font-size:10px;text-transform:uppercase;border:1px solid #ddd}
.pb td{padding:5px 7px;border:1px solid #ddd}
.pb .terms{font-size:10px;white-space:pre-wrap;color:#333;border:1px solid #ddd;padding:8px;border-radius:6px}
.pb .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px;text-align:center;font-size:11px}
.pb .sig div{border-top:1px solid #333;padding-top:4px}
.pb .ft{text-align:center;color:#888;font-size:9.5px;margin-top:14px}
.pb .ckg{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;font-size:11.5px}.pb .ckg div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #ccc;padding:2px 0}.pb .ckg span{white-space:nowrap}
.pb .wl{border-bottom:1px solid #aaa;height:20px}
#pings{position:fixed;top:72px;right:16px;z-index:95;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px))}
.ping{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:10px 12px;box-shadow:var(--sh2);animation:pop .2s ease-out}
.ping .pi{width:34px;height:34px;border-radius:9px;background:var(--pri-50);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nstep{display:flex;gap:12px;align-items:center;margin:0 20px 18px;padding:12px 14px;border-radius:12px;background:var(--pri-50);border:1px solid #bbf7d0;flex-wrap:wrap}
.nstep.wait{background:var(--soft);border-color:var(--line)}
/* ---------- mobile ---------- */
@media (max-width:860px){
  .side{display:none}
  .top{padding:9px 14px;gap:8px}
  .mtitle{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;min-width:0;flex:1}
  .mtitle .logo{width:32px;height:32px;border-radius:9px;font-size:12px}
  .mtitle span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tsearch{display:none}.tsearch.open{display:block;position:absolute;left:10px;right:10px;top:9px;max-width:none}
  .content{padding:16px 14px 110px}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  h1{font-size:21px}
  .stat{padding:13px;gap:10px}.stat .si{width:36px;height:36px}.stat .n{font-size:21px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);flex:1;padding:4px 0}
  .bnav button.on{color:var(--pri)}
  .bnav .fabb{flex:0 0 auto;margin-top:-26px}
  .bnav .fabb span{width:56px;height:56px;border-radius:18px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(21,128,61,.4)}
  .bnav .fabb span svg{width:26px;height:26px}
  .more{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:55;align-items:flex-end}
  .more.open{display:flex}
  .more .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 12px calc(84px + env(safe-area-inset-bottom))}
  .more .sheet button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:13px 12px;border-radius:10px;font-weight:600;width:calc(100% - 24px)}
  .more .sheet button:hover{background:var(--soft)}
  .modal{padding:0}
  .mbox,.mbox.lg,.mbox.sm{max-height:100vh;height:100%;border-radius:0;max-width:none}
  .kv{grid-template-columns:105px 1fr}
  .sum>div{grid-template-columns:110px 1fr}
  .rw{padding:12px 14px}
  .hide-m{display:none!important}
  .rwb{flex-wrap:wrap}.rwb .r{width:100%;justify-content:flex-end!important}
  #toast{bottom:92px}
  .pb .two{grid-template-columns:1fr}
}

/* ================== TEMA VIDRIO + COLOR ================== */
html{color-scheme:light;
 --bg:#eef3f0;--surface:rgba(255,255,255,.66);--surface-hi:rgba(255,255,255,.92);--field:rgba(255,255,255,.78);
 --glass-b:rgba(255,255,255,.75);--line:rgba(20,40,28,.10);--line2:rgba(20,40,28,.06);--soft:rgba(20,40,28,.04);
 --warn:#b45309;--blob-o:.55;--glow:rgba(34,197,94,.35);--side:rgba(10,22,16,.86);--tlbg:#f3f6f4;
 --sh:0 1px 2px rgba(16,24,18,.04),0 8px 24px rgba(16,24,18,.06);--sh2:0 18px 40px rgba(16,24,18,.14)}
html[data-theme=dark]{color-scheme:dark;
 --bg:#060a09;--surface:rgba(20,28,25,.58);--surface-hi:rgba(30,40,36,.92);--field:rgba(255,255,255,.05);
 --glass-b:rgba(255,255,255,.08);--ink:#eef5f1;--ink2:#cbd6cf;--muted:#8b9b92;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);--soft:rgba(255,255,255,.05);
 --pri:#22c55e;--pri-d:#86efac;--pri-l:rgba(34,197,94,.20);--pri-50:rgba(34,197,94,.09);
 --acc:#fbbf24;--acc-l:rgba(251,191,36,.15);--red:#f87171;--red-l:rgba(248,113,113,.15);--blue:#60a5fa;--blue-l:rgba(96,165,250,.15);
 --warn:#fbbf24;--blob-o:.5;--glow:rgba(34,197,94,.45);--side:rgba(8,14,12,.62);--tlbg:#0b1210;
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);--sh2:0 20px 50px rgba(0,0,0,.5)}
html,body{background:var(--bg)}
body{transition:background .3s}
/* fondo animado */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--blob-o);will-change:transform}
.bgfx .b1{background:radial-gradient(circle,#22c55e 0,transparent 62%);left:-25vmax;top:-30vmax;animation:drift1 26s ease-in-out infinite alternate}
.bgfx .b2{background:radial-gradient(circle,#f97316 0,transparent 62%);right:-30vmax;top:-10vmax;animation:drift2 30s ease-in-out infinite alternate;opacity:calc(var(--blob-o)*.8)}
.bgfx .b3{background:radial-gradient(circle,#06b6d4 0,transparent 62%);left:10vmax;bottom:-40vmax;animation:drift3 34s ease-in-out infinite alternate}
.bgfx .b4{background:radial-gradient(circle,#a855f7 0,transparent 62%);right:-20vmax;bottom:-35vmax;animation:drift1 38s ease-in-out infinite alternate-reverse;opacity:calc(var(--blob-o)*.7)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(127,127,127,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%)}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-16vmax) scale(1.1)}}
/* vidrio */
.card,.mbox,.kc,.mcard,.vis,.ping,.pick,.sum,.ckl{background:var(--surface);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.card{border-radius:18px;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.ch{border-bottom-color:var(--line2)}
.ch h2 .hem,.hem{font-size:18px;line-height:1;display:inline-block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.side{background:var(--side);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-right:1px solid rgba(255,255,255,.06)}
.top{background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid var(--line2)}
.nav button{transition:background .2s,color .2s,transform .2s}
.nav button:hover{transform:translateX(3px)}
.nav button.on{background:linear-gradient(90deg,rgba(34,197,94,.28),rgba(34,197,94,.06));box-shadow:inset 3px 0 0 #4ade80}
.nem{font-size:17px;width:22px;text-align:center;line-height:1;transition:transform .25s}
.nav button:hover .nem{transform:scale(1.2) rotate(-8deg)}
.recv,.btn.p{background:linear-gradient(135deg,#22c55e,#10b981 55%,#0d9488);border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}
.recv:hover,.btn.p:hover{background:linear-gradient(135deg,#34d399,#10b981 55%,#0f766e);filter:brightness(1.05)}
.btn{background:var(--field);border-color:var(--line);color:var(--ink2);border-radius:12px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s}
.btn:hover{background:var(--surface-hi);border-color:var(--line)}
.btn:active,.cpc:active,.fchip:active,.stat:active,.rw:active,.pick:active{transform:scale(.96)}
.btn.d{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.btn.d:hover{background:var(--red-l)}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.ib:hover{background:var(--soft)}
.tsearch input,.inp,.sel,.f input,.f select,.f textarea,.cpadd input{background:var(--field);border-color:var(--line);transition:border-color .2s,box-shadow .25s,background .2s}
.tsearch input:focus,.inp:focus,.sel:focus,.f input:focus,.f select:focus,.f textarea:focus,.cpadd input:focus{border-color:var(--pri);background:var(--surface-hi);box-shadow:0 0 0 4px rgba(34,197,94,.18),0 6px 20px rgba(34,197,94,.15)}
.seg{background:var(--soft)}.seg button.on{background:var(--surface-hi)}
.fchip{background:var(--field);border-color:var(--line);transition:transform .15s,background .2s}
.fchip.on{background:linear-gradient(135deg,#22c55e,#0d9488);border-color:transparent;color:#fff}.fchip.on .c{color:rgba(255,255,255,.8)}
.cpc{background:var(--field);border-color:var(--line);border-radius:12px;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.cpc:hover{border-color:var(--pri);background:var(--pri-50)}
.cpc.on{background:linear-gradient(135deg,#22c55e,#0d9488);border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--glow);animation:chipOn .3s cubic-bezier(.2,.9,.3,1.4)}
.cpc.add{background:transparent;border-color:color-mix(in srgb,var(--pri) 55%,transparent)}
@keyframes chipOn{0%{transform:scale(.88)}100%{transform:none}}
.rw{transition:background .2s}
.rw:hover{background:var(--pri-50)}
.ticon{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(6,182,212,.14));border:1px solid var(--glass-b);border-radius:13px}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--c,#22c55e),transparent 65%);opacity:.22;transition:transform .4s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.stat:hover::before{transform:scale(1.3)}
.stat .si{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff))!important;font-size:21px;border-radius:14px;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.stat .n{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--c) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge.est{color:var(--c);background:var(--b);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.badge .be{font-size:12px;line-height:1}
html[data-theme=dark] .badge.est{color:color-mix(in srgb,var(--c) 55%,#fff)}
.pp.cur{text-shadow:0 0 12px color-mix(in srgb,var(--c) 50%,transparent)}
.pp.done{border-color:var(--pri)}
.tl li::before{box-shadow:0 0 0 3px var(--tlbg),0 0 0 4px var(--line),0 0 10px var(--c,transparent)}
.kc{border-radius:18px}
.kcard{background:var(--surface-hi);border:1px solid var(--glass-b);transition:transform .2s,border-color .2s}
.kcard:hover{transform:translateY(-2px);border-color:var(--pri)}
.mcard{transition:transform .25s,box-shadow .25s,border-color .25s}
.mcard:hover{transform:translateY(-3px);border-color:var(--pri)}
.pick:hover{border-color:var(--pri)}
.pick.on,.chosen{border-color:var(--pri);background:var(--pri-50);box-shadow:0 0 0 4px rgba(34,197,94,.10)}
.who{background:var(--field);border-color:var(--line);transition:transform .15s}
.who.none{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(34,197,94,.15)}}
.av{background:linear-gradient(135deg,#34d399,#0d9488 60%,#6366f1)}
.modal{background:rgba(4,10,8,.38);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);animation:fadeIn .2s ease-out}
.mbox{background:var(--surface-hi);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
@keyframes fadeIn{from{opacity:0}}
.stp.on b{background:linear-gradient(135deg,#22c55e,#0d9488);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.empty .ei{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(168,85,247,.12));border:1px solid var(--glass-b);font-size:26px;width:60px;height:60px;border-radius:18px;animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px) rotate(-4deg)}}
#toast{background:color-mix(in srgb,#0b1410 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:16px}
#toast.show{animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{transform:translate(-50%,20px) scale(.9);filter:blur(4px)}}
.ping{border-left:4px solid var(--pri)}
.status{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:14px}
/* colores de etiquetas en oscuro */
html[data-theme=dark] .tag.n,html[data-theme=dark] .st-ok,html[data-theme=dark] .ckb button.on.ok{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.35)}
html[data-theme=dark] .tag.u{background:rgba(249,115,22,.16);color:#fdba74}
html[data-theme=dark] .st-low,html[data-theme=dark] .pl.f,html[data-theme=dark] .last,html[data-theme=dark] .status.warn,html[data-theme=dark] .role.adm{background:rgba(251,191,36,.14);color:#fcd34d;border-color:rgba(251,191,36,.3)}
html[data-theme=dark] .st-out,html[data-theme=dark] .ckb button.on.mal{background:rgba(248,113,113,.16);color:#fca5a5;border-color:rgba(248,113,113,.35)}
html[data-theme=dark] .ckb button.on.na{background:rgba(148,163,184,.14);color:#cbd5e1;border-color:rgba(148,163,184,.3)}
html[data-theme=dark] .pl.w{background:rgba(34,197,94,.12);color:#86efac;border-color:rgba(34,197,94,.3)}
html[data-theme=dark] .role.mec{background:rgba(96,165,250,.16);color:#93c5fd}
html[data-theme=dark] mark{background:rgba(250,204,21,.35);color:#fff}
html[data-theme=dark] .lockn{border-color:rgba(255,255,255,.15)}
html[data-theme=dark] .nstep{border-color:rgba(34,197,94,.3)}
html[data-theme=dark] .ticon{border-color:rgba(255,255,255,.08)}
html[data-theme=dark] table.t th{background:rgba(255,255,255,.04)}
html[data-theme=dark] .pb{color:#111}
/* animación al cambiar de página */
.enter>*,.enter>.grid>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2),.enter>.grid>*:nth-child(2){animation-delay:.06s}
.enter>*:nth-child(3),.enter>.grid>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4),.enter>.grid>*:nth-child(4){animation-delay:.18s}
.enter>*:nth-child(n+5),.enter>.grid>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* hero de inicio */
.hero{display:flex;align-items:center;gap:16px;padding:22px 24px;margin-bottom:16px;overflow:hidden;position:relative;background:linear-gradient(120deg,color-mix(in srgb,#22c55e 16%,var(--surface)),color-mix(in srgb,#f97316 12%,var(--surface)) 60%,color-mix(in srgb,#06b6d4 14%,var(--surface)))}
.hero h1{font-size:28px}.hero .gt{background:linear-gradient(90deg,var(--ink),#16a34a 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=dark] .hero .gt{background-image:linear-gradient(90deg,#f0fdf4,#4ade80 55%,#fb923c)}
.hero .wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:none}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.hero .sub{color:var(--muted);margin-top:4px}
.hero-t{flex:1;min-width:0;position:relative;z-index:1}
.hero-saw{width:230px;flex-shrink:0;position:relative;z-index:1}
/* motosierra */
.saw{width:100%;height:auto;overflow:visible;display:block}
.saw .sbody{animation:buzz .09s linear infinite}
.saw .chain{animation:chain .32s linear infinite}
.saw .sprk{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.saw .dust{transform-box:fill-box;opacity:0;animation:dust 1.1s ease-out infinite}
.saw .d2{animation-delay:.2s}.saw .d3{animation-delay:.45s}.saw .d4{animation-delay:.65s}.saw .d5{animation-delay:.85s}
.saw .smoke{transform-box:fill-box;transform-origin:center;opacity:0;animation:smoke 2.4s ease-out infinite}
.saw .smoke.s2{animation-delay:1.2s}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.5px)}50%{transform:translate(-.4px,.5px)}75%{transform:translate(.5px,.3px)}}
@keyframes chain{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dust{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,22px),var(--dy,-14px)) scale(.4)}}

/* pantalla de carga */

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LSKEY)||'null');if(j){S={...S,...j.S};CFG={...DEF_CFG,...(j.CFG||{})};CATD=j.CAT||null}}catch(e){}}

function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='permission-denied')toast('No tiene permiso para modificar datos, o el dato no es válido.');
  else if(c==='quota_exceeded')toast('La base de datos está llena: '+(e.message||''));
  else if(c==='revoked')setStatus('Se retiró el acceso a los datos de esta página.','err');
  else toast('No se pudo guardar. Intente de nuevo.');
  console.error(e);
}
async function put(col,obj){

  S[col]={...S[col],[o.id]:o};

  try{await w();return true}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700));try{await w();return true}catch(e2){handleErr(e2);return false}}handleErr(e);return false}
}

function loadScript(src){return new Promise((ok,no)=>{const x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=()=>no(new Error(src));document.head.appendChild(x)})}
async function initFirebase(){

function subscribe(db){
  const timer=setTimeout(()=>{if(!connected)setStatus('Todavía no se puede conectar con la base de datos. Lo que ve puede estar desactualizado.','warn')},10000);
  const done=new Set();const total=COLS.length+2;
  const ok=(k,snap)=>{const md=snap.metadata||{};SYNC[k]={c:!!md.fromCache,p:!!md.hasPendingWrites};syncUI();if(!snap.metadata.fromCache){done.add(k);if(done.size>=total&&!connected){connected=true;clearTimeout(timer);setStatus('')}}};
  const onErr=e=>{clearTimeout(timer);setStatus(e.code==='revoked'?'Se retiró el acceso a los datos de esta página.':e.code==='permission-denied'?'Sin permiso para leer los datos. Revise las reglas de Firestore o vuelva a iniciar sesión.':'Error al leer los datos ('+e.code+').','err')};
  const on=(ref,cb)=>FB_MODE?ref.onSnapshot({includeMetadataChanges:true},cb,onErr):ref.onSnapshot(cb,onErr);
  UNSUB=[...COLS.map(c=>on(db.collection(c),s=>{const m={};s.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S[c]=m;ok(c,s);if(c==='boletas'&&(SEEN||!s.metadata.fromCache))watchBoletas(m);later()})),
   on(db.doc('config/taller'),d=>{CFG={...DEF_CFG,...(d.exists?d.data():{})};ok('cfg',d);later()}),
   on(db.doc('config/catalogo'),d=>{CATD=d.exists?d.data():null;ok('cat',d);later()})];
}
async function initStore(){

  if(!db){LOCAL=true;loadLocal();setStatus('Modo local: los datos se guardan solo en este navegador. Haga respaldos desde Configuración.','warn');render();return}
  DB=db;subscribe(db);

async function moveStock(rid,diff,b){
  if(!diff)return;const r=rep(rid);
  if(r)await put('repuestos',{...r,stock:num(r.stock)-diff});
  await put('movimientos',{id:uid(),repuestoId:rid,tipo:diff>0?'salida':'devolución',cant:Math.abs(diff),boletaId:b.id,numero:b.numero,fecha:Date.now(),por:quien(),nota:diff>0?'Instalado en orden':'Devuelto al inventario'});
}
async function addLine(bid,r,cant){
  const b=clone(S.boletas[bid]);b.repuestos=b.repuestos||[];
  const ex=b.repuestos.find(l=>l.repuestoId===r.id);
  if(ex)ex.cant=num(ex.cant)+cant;else b.repuestos.push({repuestoId:r.id,sku:r.sku,nombre:r.nombre,condicion:r.condicion||'Nuevo',cant});
  b.historial=[...(b.historial||[]),{t:Date.now(),estado:b.estado,nota:`Instaló ${cant}× ${r.nombre}`,por:quien(),dev:DEV}];
  await moveStock(r.id,cant,b);await put('boletas',b);
}
async function qtyLine(bid,i,d){
  const b=clone(S.boletas[bid]);const l=b.repuestos[i];if(!l)return;const nq=num(l.cant)+d;
  if(nq<=0)return rmLine(bid,i);
  l.cant=nq;b.historial=[...(b.historial||[]),{t:Date.now(),estado:b.estado,nota:`${l.nombre}: cantidad ${nq}`,por:quien(),dev:DEV}];if(l.repuestoId)await moveStock(l.repuestoId,d,b);await put('boletas',b);render();
}
function rmLine(bid,i){
  const b=S.boletas[bid];const l=b.repuestos[i];
  confirmBox(`¿Quitar “${esc(l.nombre)}” de la orden?${l.repuestoId?' Se devolverá al inventario.':''}`,async()=>{const x=clone(S.boletas[bid]);const L=x.repuestos.splice(i,1)[0];x.historial=[...(x.historial||[]),{t:Date.now(),estado:x.estado,nota:`Quitó ${L.nombre}`,por:quien(),dev:DEV}];if(L.repuestoId)await moveStock(L.repuestoId,-num(L.cant),x);await put('boletas',x);closeModal();render()},'Quitar');
}

  let rs=arr(S.repuestos);
  if(q)rs=rs.filter(r=>norm([r.sku,r.nombre,r.compatible,r.marca,r.categoria].join(' ')).includes(q));
  else rs=rs.map(r=>({r,s:(e.modelo&&norm(r.compatible).includes(norm(e.modelo))?2:0)+(e.marca&&norm(r.compatible+' '+r.marca).includes(norm(e.marca))?1:0)})).sort((a,z)=>z.s-a.s||String(a.r.nombre).localeCompare(z.r.nombre)).map(x=>x.r);
  rs=rs.slice(0,30);
  const auto=!rs.length;
  if(auto&&!RP.nf)RP.nf=nfNew();
  if(!auto&&RP.nf&&!RP.nf._open)RP.nf=null;
  const list=rs.length?`${!q&&e.modelo?`<div class="small muted" style="margin-bottom:8px">Primero los compatibles con <b>${esc(eqShort(e))}</b></div>`:''}<div class="card"><div class="rows">${rs.map(r=>{const s=stockSt(r);const on=RP.sel===r.id;return `<div class="rw" data-act="rpSel" data-id="${r.id}" style="${on?'background:var(--pri-50)':''}"><div class="mn"><div class="t ell"><span class="mono">${esc(r.sku)}</span> · ${esc(r.nombre)} <span class="tag ${r.condicion==='Usado'?'u':'n'}">${esc(condLbl(r.condicion))}</span></div><div class="m ell">${esc(r.compatible||r.categoria||'')}${r.ubicacion?' · 📍 '+esc(r.ubicacion):''}</div></div>
    ${on?`<div class="row"><div class="qty"><button data-act="rpCant" data-d="-1">${ic('minus')}</button><span>${RP.cant}</span><button data-act="rpCant" data-d="1">${ic('plus')}</button></div><button class="btn p sm" data-act="rpAdd">${ic('check')} Agregar</button></div>`:`<span class="badge ${s.c}">${num(r.stock)} disp.</span>`}</div>${on&&num(r.stock)<RP.cant?`<div class="err small" style="padding:0 18px 10px">Solo hay ${num(r.stock)} en inventario. Se agregará igual y el stock quedará en negativo.</div>`:''}`}).join('')}</div></div>`:'';
  el.innerHTML=list+(RP.nf?`<div style="margin-top:${rs.length?14:0}px">${nfForm(auto)}</div>`:`<button class="btn" style="margin-top:12px" data-act="nfOpen">${ic('plus')} ¿No está en la lista? Registrar repuesto nuevo</button>`);
}
async function nfSave(){
  const f=RP.nf;f.sku=String(f.sku||'').trim().toUpperCase();f.nombre=String(f.nombre||'').trim();
  const err=m=>{const x=$('#nfErr');if(x)x.textContent=m};
  if(!f.nombre)return err('Escriba el nombre del repuesto.');
  if(!f.sku)return err('Falta el código.');
  if(arr(S.repuestos).some(r=>r.sku===f.sku))return err('Ya existe un repuesto con el código '+f.sku+'. Cámbielo.');
  const entra=Math.max(0,num(f.entra)),usa=Math.max(0,num(f.usa));
  if(!entra&&!usa)return err('Indique cuántos entran al stock.');
  const bid=RP.bid;
  const r={id:uid(),sku:f.sku,nombre:f.nombre,condicion:f.condicion,compatible:f.compatible.trim(),ubicacion:f.ubicacion.trim(),stock:entra,stockMin:num(CFG.stockMinDef)};
  if(entra)await put('movimientos',{id:uid(),repuestoId:r.id,tipo:'entrada',cant:entra,fecha:Date.now(),por:quien(),nota:'Registrado desde la orden '+nb(S.boletas[bid].numero)});
  if(!await put('repuestos',r))return;
  if(usa)await addLine(bid,S.repuestos[r.id],usa);
  closeModal();render();toast(`“${r.nombre}” guardado en el stock${usa?' y agregado a la orden':''}`);
}

const dd=(a,b)=>Math.round((new Date(String(b).slice(0,10)+'T00:00:00')-new Date(String(a).slice(0,10)+'T00:00:00'))/864e5);
function prevInfo(b,fallasDraft){
  if(!b||!b.equipoId)return null;
  const prev=arr(S.boletas).filter(x=>x.equipoId===b.equipoId&&x.id!==b.id&&x.estado!=='Cancelado'&&(!b.numero||num(x.numero)<num(b.numero)))
    .sort((a,z)=>String(z.fechaIngreso).localeCompare(String(a.fechaIngreso))||num(z.numero)-num(a.numero));
  const p=prev[0];if(!p)return null;
  const ref=b.fechaIngreso||today();
  const fin=p.fechaEntrega||'';
  const enGar=p.estado==='Entregado'&&fin&&num(p.garantiaDias)>0&&dd(fin,ref)>=0&&dd(fin,ref)<=num(p.garantiaDias);
  const mine=(fallasDraft||b.fallas||[]).map(norm);
  const same=(p.fallas||[]).filter(f=>mine.includes(norm(f)));
  return {p,enGar,same,dias:fin?dd(fin,ref):dd(p.fechaIngreso,ref),veces:prev.length};
}

  return `<div style="background:${bg};border:1px solid ${col}33;border-left:4px solid ${col};border-radius:10px;padding:12px 14px;margin-bottom:${compact?0:16}px">
   <div style="font-weight:800;color:${col};display:flex;gap:6px;align-items:center">${tit}<span class="small muted" style="font-weight:500;margin-left:4px">· ${pi.veces} visita${pi.veces!==1?'s':''} anteriores</span></div>
   <div class="small" style="margin-top:4px">Última: <a href="#" class="num" data-act="open" data-page="orden" data-id="${p.id}">${nb(p.numero)}</a> recibida ${fdate(p.fechaIngreso)}${p.fechaEntrega?`, entregada ${fdate(p.fechaEntrega)} (hace ${pi.dias} días${num(p.garantiaDias)?`, garantía ${num(p.garantiaDias)} días`:''})`:` · ${esc(p.estado)}`}</div>

async function pMark(){

function pdRecibir(id){

const stamp=()=>today()+'_'+pad(new Date().getHours())+pad(new Date().getMinutes());
const fname=t=>norm(t).replace(/[^a-z0-9]+/g,'_');
async function repXls(k){
  const R=REPORTS[k];const secs=R.build();
  if(typeof XLSX==='undefined'){ // respaldo: CSV
    const s=secs[0];const csv=[s.head,...s.rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    return saveFile(fname(R.t)+'_'+stamp()+'.csv','﻿'+csv);
  }
  const wb=XLSX.utils.book_new();
  secs.forEach(s=>{const aoa=[[CFG.nombre],[R.t],[rangoTxt()],[],s.head,...s.rows];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=s.head.map((h,j)=>({wch:Math.min(45,Math.max(String(h).length,...s.rows.map(r=>String(r[j]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,(s.title||R.t).slice(0,30))});
  await saveFile(fname(R.t)+'_'+stamp()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]));
}
async function repPdf(k){
  if(!window.jspdf||!window.jspdf.jsPDF)return toast('No se pudo cargar el generador de PDF. Revise la conexión e intente de nuevo.');
  const R=REPORTS[k];const secs=R.build();const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:secs[0].head.length>6?'landscape':'portrait',unit:'pt',format:'letter'});
  doc.setFontSize(14);doc.setTextColor(20,83,45);doc.text(CFG.nombre||'Taller',40,40);
  doc.setFontSize(11);doc.setTextColor(30,30,30);doc.text(R.t,40,58);
  doc.setFontSize(8.5);doc.setTextColor(120,120,120);doc.text(rangoTxt()+' · Generado '+fts(Date.now()),40,72);
  let y=86;
  secs.forEach(s=>{const al={};(s.num||[]).forEach(i=>al[i]={halign:'right'});
    if(s.title){doc.setFontSize(10);doc.setTextColor(30,30,30);doc.text(s.title,40,y+4);y+=12}
    doc.autoTable({startY:y,head:[s.head],body:s.rows.length?s.rows.map(r=>r.map(v=>String(v??''))):[[{content:'Sin datos en el período',colSpan:s.head.length}]],styles:{fontSize:8,cellPadding:4},headStyles:{fillColor:[21,128,61]},alternateRowStyles:{fillColor:[247,250,247]},columnStyles:al,margin:{left:40,right:40}});
    y=doc.lastAutoTable.finalY+20});
  await saveFile(fname(R.t)+'_'+stamp()+'.pdf',doc.output('blob'));
}
async function saveFile(name,data){
  if(!DL){try{const bl=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(name)?'text/html':'text/plain'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return true}catch(e){toast('No se pudo descargar el archivo.');return false}}
  try{await DL.save({filename:name,data});return true}
  catch(e){const c=e&&e.code;if(c==='declined')return false;toast(c==='rate_limited'?'Ya hay una descarga esperando confirmación.':'No se pudo descargar el archivo.');return false}
}

function loadLogo(file){
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=async()=>{const M=256;const k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let d=c.toDataURL('image/png');if(d.length>150000)d=c.toDataURL('image/jpeg',.82);if(await saveCfg({...CFG,logo:d})){toast('Logo guardado');render()}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo leer la imagen')};img.src=url;

let SCAN=null;
function stopScan(){if(!SCAN)return;SCAN.on=false;clearTimeout(SCAN.t);try{SCAN.st&&SCAN.st.getTracks().forEach(t=>t.stop())}catch(e){}SCAN=null}
async function scanQR(){
  openModal('📷 Escanear etiqueta',`<div class="scanbox"><video id="scV" playsinline muted autoplay></video><div class="scfr"></div></div><p class="small muted" id="scMsg" style="text-align:center;margin:12px 0 0">Apunte la cámara al código QR de la etiqueta de la máquina.</p>`,`<input class="inp" id="scTxt" placeholder="…o escriba el número de orden" style="flex:1"><button class="btn p" id="scGo">Buscar</button>`,'sm');
  const done=txt=>{txt=String(txt||'').trim();if(!txt)return;stopScan();closeModal();const m=/os-(\d+)/i.exec(txt)||/^(?:OS-?)?0*(\d+)$/i.exec(txt);if(m){PEND=+m[1];view={page:'ordenes'};stack=[];tryPend();render();if(view.page!=='orden')toast('No se encontró la orden '+txt);return}UI.q=txt;$('#qGlobal').value=txt;render()};
  $('#scGo').onclick=()=>done($('#scTxt').value);$('#scTxt').onkeydown=e=>{if(e.key==='Enter')done(e.target.value)};
  const msg=t=>{const e=$('#scMsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Este navegador no permite usar la cámara. Escriba el número de orden abajo.');
  SCAN={on:true};let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){SCAN=null;return msg('No se pudo abrir la cámara. Revise el permiso de cámara del navegador, o escriba el número de orden abajo.')}
  if(!SCAN){st.getTracks().forEach(t=>t.stop());return}SCAN.st=st;const v=$('#scV');v.srcObject=st;try{await v.play()}catch(e){}
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det&&typeof jsQR==='undefined'){for(const u of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js','https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js']){try{await loadScript(u);if(typeof jsQR!=='undefined')break}catch(e){}}}
  if(!det&&typeof jsQR==='undefined')return msg('No se pudo cargar el lector de QR. Escriba el número de orden abajo.');
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(!SCAN||!SCAN.on)return;try{if(v.readyState>=2){let r=null;
    if(det){const c=await det.detect(v);r=c[0]&&c[0].rawValue}else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const c=jsQR(cx.getImageData(0,0,w,h).data,w,h);r=c&&c.data}
    if(r){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}return done(r)}}}catch(e){}
    if(SCAN)SCAN.t=setTimeout(tick,220)};tick();
}

const CPR={};
function chipPick(name){
  const c=CPR[name];const items=c.items();const v=c.get();const on=x=>c.multi?(v||[]).some(y=>norm(y)===norm(x)):norm(v)===norm(x);
  const many=items.length>18;const f=norm(c._f||'');

function cpToggle(name,val){
  const c=CPR[name];
  if(c.multi){const cur=[...(c.get()||[])];const i=cur.findIndex(y=>norm(y)===norm(val));i>=0?cur.splice(i,1):cur.push(val);c.set(cur)}
  else c.set(norm(c.get())===norm(val)?'':val);
  c.re();
}
async function cpAdd(name,val){

/* ---------- indicador de sincronización ---------- */
const SYNC={};let SYNC_T=0,SYNC_ST='';
function syncState(){
  if(LOCAL)return 'local';
  if(!navigator.onLine)return 'off';
  const v=Object.values(SYNC);
  if(v.some(x=>x.p))return 'sync';
  if(!connected||v.some(x=>x.c))return v.length?'conn':'conn';
  return 'ok';
}
const SYNC_L={ok:['Sincronizado','🟢'],sync:['Sincronizando…','🟡'],conn:['Conectando…','🟡'],off:['Sin conexión','🔴'],local:['Solo este aparato','⚪']};
function syncUI(){
  const st=syncState();if(st==='ok'&&SYNC_ST!=='ok')SYNC_T=Date.now();
  if(st==='off'&&SYNC_ST&&SYNC_ST!=='off')toast('🔴 Sin internet: lo que haga se guarda en este aparato y se sincroniza al volver la conexión');
  if(st==='ok'&&SYNC_ST==='off')toast('🟢 Conexión recuperada: todo sincronizado');
  SYNC_ST=st;const b=$('#syncBox');if(!b)return;
  b.className='sync s-'+st;b.title=SYNC_L[st][0];
  b.innerHTML=`<i></i><span class="hide-m">${SYNC_L[st][0]}</span>`;
}
window.addEventListener('online',()=>syncUI());window.addEventListener('offline',()=>syncUI());
setInterval(syncUI,15000);

function moSync(){if(!MO)return;const v=id=>{const e=$(id);return e?e.value:null};const c=v('#moC'),d=v('#moD'),h=v('#moHv'),n=v('#moN');if(c!=null)MO.c=c.trim();if(d!=null)MO.d=d.trim();if(h!=null)MO.h=Math.max(0,num(h));if(n!=null)MO.nota=n.trim()}

function pbWrap(title,body){

  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"><style>@page{size:letter;margin:12mm}body{margin:0;padding:18px;background:#fff}.pb{max-width:780px;margin:auto}${css}@media print{body{padding:0}}</style></head><body><div class="pb">${body}</div><script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>`;
}

let SEEN=null;
function watchBoletas(m){
  const sn=b=>({e:b.estado,tr:!!b.tallerRecibio,rr:!!b.recepRecibio});
  if(!SEEN){SEEN={};Object.values(m).forEach(b=>SEEN[b.id]=sn(b));return}
  Object.values(m).forEach(b=>{const old=SEEN[b.id],now=sn(b);SEEN[b.id]=now;
    const h=b.historial||[];const last=h[h.length-1]||{};if(!last.dev||last.dev===DEV)return;
    const who=last.por?' · '+last.por:'';const desc=()=>`${nb(b.numero)} · ${eqShort(eq(b.equipoId))} · ${cli(b.clienteId)?.nombre||''}`;
    if(!old){if(esTaller())ping('Nueva máquina para el taller'+who,desc,b.id);return}
    if(old.e!==now.e&&now.e==='Listo para entregar'&&esRecep())ping('Máquina lista en el taller'+who,desc,b.id);
    else if(!old.rr&&now.rr&&esTaller())ping('Recepción recibió la máquina reparada'+who,desc,b.id);
    else if(!old.tr&&now.tr&&esRecep())ping('El taller recibió la máquina'+who,desc,b.id);
  });
}
function beep(){try{const A=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());[0,.18].forEach(dt=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.0001,A.currentTime+dt);g.gain.exponentialRampToValueAtTime(.25,A.currentTime+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+dt+.15);o.start(A.currentTime+dt);o.stop(A.currentTime+dt+.16)})}catch(e){}}
function ping(title,desc,id){
  setTimeout(()=>{const d=typeof desc==='function'?desc():desc;let box=$('#pings');if(!box){box=document.createElement('div');box.id='pings';document.body.appendChild(box)}
    const el=document.createElement('div');el.className='ping';el.innerHTML=`<div class="pi">${ic('bell')}</div><div style="flex:1;min-width:0"><b>${esc(title)}</b><div class="small ell">${esc(d)}</div></div><button class="btn sm p">Ver</button><button class="ib" aria-label="Cerrar">${ic('x')}</button>`;
    el.querySelector('.btn').onclick=()=>{el.remove();typeof id==='function'?id():go({page:'orden',id})};el.querySelector('.ib').onclick=()=>el.remove();
    box.prepend(el);setTimeout(()=>el.remove(),20000);beep();
    try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body:d,icon:'icons/icon-192.png'});n.onclick=()=>{window.focus();go({page:'orden',id})}}}catch(e){}
  },400);
}

/* ================== Eventos ================== */
document.addEventListener('click',e=>{
  const wa=e.target.closest('a[href^="https://wa.me/"]');if(wa){e.preventDefault();e.stopPropagation();const pw=wa.dataset.act==='pWa';waPreview(wa.href,pw?()=>A.pWa({}):null);return}
  const a=e.target.closest('a[href]');if(a&&a.getAttribute('href')!=='#'&&!a.dataset.act)return; // enlaces reales
  if(e.target.id==='more')return closeMore();
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='pWa'){A.pWa(t.dataset);return}
  e.preventDefault();const f=A[t.dataset.act];if(f)f(t.dataset);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui){UI[t.dataset.ui]=t.value;if(t.id==='qGlobal'){render()}else render();return}
  if(t.dataset.wq!=null&&W){W.qc=t.value;const q=norm(W.qc);const rs=q?arr(S.clientes).filter(c=>norm([c.nombre,c.telefono,c.telefono2,c.cedula].join(' ')).includes(q)).slice(0,12):arr(S.clientes).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);$('#wqRes').innerHTML=wCliRes(rs,q);return}
  if(t.dataset.w&&W){const [o,k]=t.dataset.w.split('.');(o==='d'?W.d:W[o])[k]=t.value;return}
  if(t.dataset.tr&&TR){TR[t.dataset.tr]=t.value;dirtyTrab();return}
  if(t.dataset.ef&&EF){EF[t.dataset.ef]=t.value;return}
  if(t.dataset.rf&&RF){RF[t.dataset.rf]=t.value;return}
  if(t.dataset.nf&&RP&&RP.nf){RP.nf[t.dataset.nf]=t.value;if(t.dataset.nf==='nombre')RP.nf._t=true;if(['entra','usa'].includes(t.dataset.nf)){const i=$('#nfInfo');if(i)i.innerHTML=nfInfo()}return}
  if(t.dataset.cpf){const c=CPR[t.dataset.cpf];c._f=t.value;const box=$('#cp_'+t.dataset.cpf);if(box){box.outerHTML=chipPick(t.dataset.cpf);const i=document.querySelector(`[data-cpf="${t.dataset.cpf}"]`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}return}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset.cpin){e.preventDefault();cpAdd(t.dataset.cpin,t.value);return}
  if(e.key==='Enter'&&t.id==='revNew'){e.preventDefault();document.querySelector('[data-act=revAdd]')?.click();return}
  if(e.key==='Enter'&&t.id==='ckNew'){e.preventDefault();A.ckAdd();return}
  if(e.key==='Enter'&&t.id==='whoNew'){e.preventDefault();A.whoAdd();return}
  if(e.key==='Enter'&&t.dataset.catadd){e.preventDefault();A.catAdd({k:t.dataset.catadd});return}
  if(e.key==='Enter'&&t.id==='wq'){e.preventDefault();const f=document.querySelector('#wqRes .pick');if(f)f.click();return}
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(UI.q)A.clearQ();closeMore()}
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(t.tagName)&&innerWidth>860){e.preventDefault();$('#qGlobal').focus()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files[0])importFile(t.files[0]);
  if(t.id==='logoFile'&&t.files[0])loadLogo(t.files[0]);
  if(t.dataset.perp!=null||t.dataset.pere!=null){if(!isAdmin())return toast('Solo el administrador');const L=personal();const i=+(t.dataset.perp??t.dataset.pere);if(L[i]){if(t.dataset.perp!=null)L[i].puesto=t.value;else L[i].email=t.value.trim();savePersonal(L).then(()=>{toast('Personal actualizado');render()})}}
  if(t.dataset.pon){UI.pOn[t.dataset.pon]=t.checked;render()}
  if(t.dataset.pprov){const k=t.dataset.pprov,v=t.value;(async()=>{if(k.startsWith('m:')){const m=S.porpedir[k.slice(2)];if(m)await put('porpedir',{...m,proveedor:v})}else{const r=rep(k.slice(2));if(r)await put('repuestos',{...r,proveedor:v})}render()})()}
  if(t.dataset.ptel!=null){const c=CAT();c.proveedores=[...(c.proveedores||[])];const i=+t.dataset.ptel;if(c.proveedores[i]){c.proveedores[i]={...c.proveedores[i],tel:t.value.trim()};saveCat(c).then(()=>{toast('Teléfono guardado');render()})}}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='cfgForm'){const d=formData(e.target);['garantia','stockMinDef','diasRetiro','diasSinMov','diasTaller','mesesMant','diasAprob','diasPedido'].forEach(k=>{if(k in d)d[k]=num(d[k])});if(await saveCfg({...CFG,...d})){toast('Configuración guardada');render()}}
});
$('#qGlobal').addEventListener('blur',()=>{if(!UI.q)$('#tsearch').classList.remove('open')});
async function importFile(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Archivo no válido')}
  if(!j||!COLS.some(c=>j[c]))return toast('El archivo no parece un respaldo del taller');
  const n=COLS.reduce((s,c)=>s+Object.keys(j[c]||{}).length,0);
  confirmBox(`Se importarán ${n} registros. Los que tengan el mismo identificador se reemplazan. ¿Continuar?`,async()=>{
    $('#cYes').textContent='Importando…';
    if(j.config)await saveCfg(j.config);if(j.catalogo)await saveCat(j.catalogo);
    for(const c of COLS)for(const o of Object.values(j[c]||{}))if(o&&o.id)await put(c,o);
    closeModal();render();toast('Respaldo importado')},'Importar');
}
