   const fm={};arr(S.boletas).filter(b=>b.estado!=='Cancelado'&&inRange(b.fechaIngreso)).forEach(b=>(b.fallas||[]).forEach(f=>fm[f]=(fm[f]||0)+1));
   return [{title:'Por marca y modelo',head:['Marca / modelo','Tipo','Órdenes','Fallas más comunes','Repuestos más usados','Trabajos más comunes'],num:[2],rows},{title:'Fallas en general',head:['Falla','Veces'],num:[1],rows:Object.entries(fm).sort((a,b)=>b[1]-a[1])}]}},
 tecnicos:{t:'Trabajo por técnico',i:'users',d:'Órdenes asignadas, entregadas, activas y días promedio hasta la entrega.',build(){
   const g={};arr(S.boletas).filter(b=>b.estado!=='Cancelado'&&inRange(b.fechaIngreso)).forEach(b=>{(b.manoObra||[]).forEach(l=>{const t=l.tec||b.tecnico||'Sin asignar';const q=g[t]||(g[t]={n:0,e:0,a:0,d:0,h:0});q.h=(q.h||0)+num(l.h)});const k=b.tecnico||'Sin asignar';const o=g[k]||(g[k]={n:0,e:0,a:0,d:0,h:0});o.n++;if(b.estado==='Entregado'){o.e++;o.d+=daysBetween(b.fechaIngreso,b.fechaEntrega||today())}else o.a++});
   return [{head:['Técnico','Órdenes','Entregadas','En taller','Promedio días','Horas mano de obra'],num:[1,2,3,4,5],rows:Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>[k,o.n,o.e,o.a,o.e?Math.round(o.d/o.e*10)/10:'—',Math.round((o.h||0)*100)/100])}]}},
 manoobra:{t:'Mano de obra',i:'wrench',d:'Trabajos hechos con su código, técnico y horas utilizadas en el período.',build(){

   const ag={};rows.forEach(r=>{const k=r[4]+'|'+r[5];const o=ag[k]||(ag[k]=[r[4],r[5],0,0]);o[2]++;o[3]+=r[7]});
   return [{title:'Resumen por trabajo',head:['Código','Trabajo','Veces','Horas'],num:[2,3],rows:Object.values(ag).sort((a,b)=>b[3]-a[3]).map(r=>[r[0],r[1],r[2],Math.round(r[3]*100)/100])},{title:'Detalle',head:['Fecha','Orden','Cliente','Equipo','Código','Trabajo','Técnico','Horas'],num:[7],rows:rows.sort((a,b)=>b[1].localeCompare(a[1]))}]}},
 usados:{t:'Repuestos utilizados',i:'box',d:'Qué repuestos nuevos y de segunda se instalaron en el período.',build(){

 stock:{t:'Inventario de repuestos',i:'file',d:'Existencias actuales: lo que entró, lo usado, lo disponible y lo que hay que reponer.',build(){
   const ms=movStats();return [{head:['Código','Cód. proveedor','Proveedor','Repuesto','Condición','Categoría','Compatible','Ubicación','Entró','Usado','Disponible','Mínimo','Estado'],num:[8,9,10,11],rows:arr(S.repuestos).sort((a,b)=>String(a.sku).localeCompare(String(b.sku))).map(r=>{const m=ms[r.id]||{ing:0,usa:0};return [r.sku,r.codProv||'',r.proveedor||'',r.nombre,condLbl(r.condicion),r.categoria||'',r.compatible||'',r.ubicacion||'',m.ing,m.usa,num(r.stock),num(r.stockMin),stockSt(r).l]})}]}},
 marcas:{t:'Equipos por marca y modelo',i:'tractor',d:'Qué marcas y modelos llegan más al taller en el período.',build(){

  <div class="card cp-in" style="margin-bottom:16px"><div class="fr" style="align-items:end"><div class="f"><label>Desde</label><input id="rDesde" type="date" data-ui="rDesde" value="${esc(UI.rDesde)}"></div><div class="f"><label>Hasta</label><input id="rHasta" type="date" data-ui="rHasta" value="${esc(UI.rHasta)}"></div>
   <div class="f"><div class="row"><button class="btn" data-act="rango" data-r="mes">Este mes</button><button class="btn" data-act="rango" data-r="ant">Mes anterior</button>${UI.rDesde||UI.rHasta?`<button class="btn ghost" data-act="rango" data-r="">${ic('x')} Todo</button>`:''}</div></div></div>

function repPreview(k){

  openModal(esc(R.t),`<p class="small muted" style="margin-top:0">${esc(CFG.nombre)} · ${rangoTxt()} · Generado ${fts(Date.now())}</p>${secs.map(s=>`${s.title?`<h3 style="margin:14px 0 8px">${esc(s.title)}</h3>`:''}<div class="card"><div class="tw"><table class="t"><thead><tr>${s.head.map((h,i)=>`<th class="${(s.num||[]).includes(i)?'n':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.length?s.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${(s.num||[]).includes(i)?'n':''}">${esc(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${s.head.length}" class="muted">Sin datos en el período.</td></tr>`}</tbody></table></div></div>`).join('')}`,
   `<span class="small muted">${secs[0].rows.length} fila${secs[0].rows.length!==1?'s':''}</span><span class="sp"></span><button class="btn" data-act="repPdf" data-k="${k}">${ic('dl')} PDF</button><button class="btn p" data-act="repXls" data-k="${k}">${ic('dl')} Excel</button>`,'lg');
}
const stamp=()=>today()+'_'+pad(new Date().getHours())+pad(new Date().getMinutes());
const fname=t=>norm(t).replace(/[^a-z0-9]+/g,'_');
const LIBS={};function loadLib(u){return LIBS[u]||(LIBS[u]=new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=()=>{delete LIBS[u];ko()};document.head.appendChild(sc)}))}
async function repXls(k){
  if(typeof XLSX==='undefined'){toast('Preparando Excel…');try{await loadLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}catch(e){}}
  const R=REPORTS[k];const secs=R.build();
  if(typeof XLSX==='undefined'){ // respaldo: CSV
    const s=secs[0];const csv=[s.head,...s.rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    return saveFile(fname(R.t)+'_'+stamp()+'.csv','﻿'+csv);
  }
  const wb=XLSX.utils.book_new();
  secs.forEach(s=>{const aoa=[[CFG.nombre],[R.t],[rangoTxt()],[],s.head,...s.rows];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=s.head.map((h,j)=>({wch:Math.min(45,Math.max(String(h).length,...s.rows.map(r=>String(r[j]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,(s.title||R.t).slice(0,30))});
  await saveFile(fname(R.t)+'_'+stamp()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]));
}
async function repPdf(k){
  if(!window.jspdf){toast('Preparando PDF…');try{await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js')}catch(e){}}
  if(!window.jspdf||!window.jspdf.jsPDF)return toast('No se pudo cargar el generador de PDF. Revise la conexión e intente de nuevo.');
  const R=REPORTS[k];const secs=R.build();const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:secs[0].head.length>6?'landscape':'portrait',unit:'pt',format:'letter'});
  doc.setFontSize(14);doc.setTextColor(20,83,45);doc.text(CFG.nombre||'Taller',40,40);
  doc.setFontSize(11);doc.setTextColor(30,30,30);doc.text(R.t,40,58);
  doc.setFontSize(8.5);doc.setTextColor(120,120,120);doc.text(rangoTxt()+' · Generado '+fts(Date.now()),40,72);
  let y=86;
  secs.forEach(s=>{const al={};(s.num||[]).forEach(i=>al[i]={halign:'right'});
    if(s.title){doc.setFontSize(10);doc.setTextColor(30,30,30);doc.text(s.title,40,y+4);y+=12}
    doc.autoTable({startY:y,head:[s.head],body:s.rows.length?s.rows.map(r=>r.map(v=>String(v??''))):[[{content:'Sin datos en el período',colSpan:s.head.length}]],styles:{fontSize:8,cellPadding:4},headStyles:{fillColor:[21,128,61]},alternateRowStyles:{fillColor:[247,250,247]},columnStyles:al,margin:{left:40,right:40}});
    y=doc.lastAutoTable.finalY+20});
  await saveFile(fname(R.t)+'_'+stamp()+'.pdf',doc.output('blob'));
}
async function saveFile(name,data,pick){
  if(!DL&&pick&&window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Respaldo del taller',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(data);await w.close();return true}catch(e){if(e&&e.name==='AbortError')return false}}
  if(!DL){try{const bl=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(name)?'text/html':'text/plain'});const u=URL.createObjectURL(bl);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return true}catch(e){toast('No se pudo descargar el archivo.');return false}}
  try{await DL.save({filename:name,data});return true}
  catch(e){const c=e&&e.code;if(c==='declined')return false;toast(c==='rate_limited'?'Ya hay una descarga esperando confirmación.':'No se pudo descargar el archivo.');return false}
}

let SCAN=null;
function stopScan(){if(!SCAN)return;SCAN.on=false;clearTimeout(SCAN.t);try{SCAN.st&&SCAN.st.getTracks().forEach(t=>t.stop())}catch(e){}SCAN=null}
async function scanQR(){scanCode({title:'📷 Escanear',hint:'Apunte al QR de una orden o al código de barras de un repuesto.',onCode:scanGlobal,manual:'…o escriba el número de orden o el código'})}
function scanGlobal(txt){
  txt=String(txt||'').trim();if(!txt)return;const n=norm(txt);
  const m=/os-(\d+)/i.exec(txt)||/^(?:OS-?)?0*(\d{1,6})$/i.exec(txt);
  if(m&&arr(S.boletas).some(b=>+b.numero===+m[1])){PEND=+m[1];view={page:'ordenes'};stack=[];tryPend();render();return}
  const r=arr(S.repuestos).find(r=>[r.codBarras,r.sku,r.codProv].some(x=>x&&norm(x)===n));
  if(r){go({page:'repuesto',id:r.id});toast('📦 '+r.nombre);return}
  UI.q=txt;$('#qGlobal').value=txt;render();toast('Buscando “'+txt+'”')
}
async function scanCode({title,hint,onCode,manual,keep}){
  stopScan();let o=$('#scanOv');if(o)o.remove();o=document.createElement('div');o.id='scanOv';
  o.innerHTML=`<div class="scbox"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:16px">${title}</b><button class="ib" data-sc="x">${ic('x')}</button></div>
   <div class="scanbox"><video id="scV" playsinline muted autoplay></video><div class="scfr"></div></div><p class="small muted" id="scMsg" style="text-align:center;margin:10px 0">${hint}</p>
   <div class="row" style="flex-wrap:nowrap"><input class="inp" id="scTxt" placeholder="${manual||'…o escríbalo aquí'}" style="flex:1;min-width:0"><button class="btn p" data-sc="go">Listo</button></div>
   ${keep?`<div class="small" id="scLast" style="text-align:center;margin-top:10px;font-weight:700">Escanee uno tras otro. Toque ✕ al terminar.</div>`:''}</div>`;
  document.body.appendChild(o);
  const close=()=>{stopScan();o.remove()};let last='',lastT=0;
  const done=txt=>{txt=String(txt||'').trim();if(!txt)return;if(keep){if(txt===last&&Date.now()-lastT<1800)return;last=txt;lastT=Date.now();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}chime([1046]);const r=onCode(txt);const l=$('#scLast');if(l)l.textContent=r||('✔ '+txt);$('#scTxt').value='';return}close();onCode(txt)};
  o.onclick=e=>{const k=e.target.closest('[data-sc]')?.dataset.sc;if(k==='x'||e.target===o)close();else if(k==='go')done($('#scTxt').value)};
  $('#scTxt').onkeydown=e=>{if(e.key==='Enter')done(e.target.value)};
  const msg=t=>{const e=$('#scMsg');if(e)e.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('Este navegador no permite usar la cámara. Escriba el código abajo.');
  SCAN={on:true};let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){SCAN=null;return msg('No se pudo abrir la cámara. Revise el permiso de cámara del navegador, o escriba el código abajo.')}
  if(!SCAN||!document.body.contains(o)){st.getTracks().forEach(t=>t.stop());SCAN=null;return}SCAN.st=st;const v=$('#scV');v.srcObject=st;try{await v.play()}catch(e){}
  let det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();const fm=['qr_code','ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','codabar'].filter(x=>f.includes(x));if(fm.length)det=new BarcodeDetector({formats:fm})}catch(e){det=null}}
  let zx=null;
  if(!det){if(typeof ZXing==='undefined'){for(const u of ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js']){try{await loadScript(u);if(typeof ZXing!=='undefined')break}catch(e){}}}
    if(typeof ZXing!=='undefined'){try{zx=new ZXing.MultiFormatReader();const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(h)}catch(e){zx=null}}
    if(!zx&&typeof jsQR==='undefined'){for(const u of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js','https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js']){try{await loadScript(u);if(typeof jsQR!=='undefined')break}catch(e){}}}}
  if(!det&&!zx&&typeof jsQR==='undefined')return msg('No se pudo cargar el lector. Escriba el código abajo.');
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(!SCAN||!SCAN.on)return;try{if(v.readyState>=2){let r=null;
    if(det){const c=await det.detect(v);r=c[0]&&c[0].rawValue}
    else{const w=Math.min(800,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
     if(zx){try{const lum=new ZXing.HTMLCanvasElementLuminanceSource(cv);const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));r=zx.decode(bmp).getText()}catch(e){r=null}}
     else{const c=jsQR(cx.getImageData(0,0,w,h).data,w,h);r=c&&c.data}}
    if(r){done(r);if(!keep)return}}}catch(e){}
    if(SCAN)SCAN.t=setTimeout(tick,keep?300:220)};tick();
}

async function wSave(print){
  if(!wValid(2))return;
  const btns=document.querySelectorAll('#mf .btn');btns.forEach(b=>b.disabled=true);
  try{
    const d=W.d;
    if(W.nc){const c={id:uid(),...W.nc};if(!await put('clientes',c))throw 0;d.clienteId=c.id}
    if(W.ne){const e={id:uid(),clienteId:d.clienteId,...W.ne};if(!await put('equipos',e))throw 0;d.equipoId=e.id;
      const c=CAT();let ch=false;if(e.tipo&&!c.tipos.some(x=>norm(x)===norm(e.tipo))){c.tipos=[...c.tipos,e.tipo];ch=true}if(e.marca&&!c.marcas.some(x=>norm(x)===norm(e.marca))){c.marcas=[...c.marcas,e.marca];ch=true}if(e.modelo&&!c.modelos.some(x=>norm(x.m)===norm(e.marca)&&norm(x.n)===norm(e.modelo))){c.modelos=[...c.modelos,{m:e.marca,t:e.tipo,n:e.modelo}];ch=true}if(ch)await saveCat(c)}
    let b;
    if(W.edit){b={...clone(S.boletas[W.edit]),...['fechaIngreso','clienteId','equipoId','tipoServicio','prioridad','fallas','falla','condiciones','condicion','accesorios','accesoriosOtros','horas','tecnico','fechaEstimada','faltantes','procedencia','traePor','traeTel','observaciones'].reduce((o,k)=>(o[k]=d[k],o),{})}}
    else b={...d,numero:nextNumero(),estado:'Recibido',repuestos:[],trabajos:[],garantiaDias:num(CFG.garantia),historial:[{t:Date.now(),estado:'Recibido',nota:'Recibido en recepción'+(PUESTO==='recepcion'?' · enviado al taller':''),por:quien(),dev:DEV}]};
    if(!await put('boletas',b))throw 0;
    const isNew=!W.edit;closeModal();
    stack=[{page:'ordenes'}];view={page:'orden',id:b.id};render();scrollTo(0,0);
    if(isNew&&!print)enviadoTaller(b);else toast(isNew?'📤 Orden '+nb(b.numero)+' enviada al taller':'Recepción actualizada');
    if(print)printMenu(b.id,'recepcion');
  }catch(e){btns.forEach(b=>b.disabled=false);if(e)console.error(e)}
}

/* ---------- indicador de sincronización ---------- */
const SYNC={};let SYNC_T=0,SYNC_ST='';
function syncState(){
  if(LOCAL)return 'local';
  if(!navigator.onLine)return 'off';
  const v=Object.values(SYNC);
  if(v.some(x=>x.p))return 'sync';
  if(!connected||v.some(x=>x.c))return v.length?'conn':'conn';
  return 'ok';
}
const SYNC_L={ok:['Sincronizado','🟢'],sync:['Sincronizando…','🟡'],conn:['Conectando…','🟡'],off:['Sin conexión','🔴'],local:['Solo este aparato','⚪']};
let _syncShow='',_syncT=0;
function syncUI(){
  let st=syncState();
  if(st==='sync'&&_syncShow==='ok'){if(!_syncT)_syncT=setTimeout(()=>{_syncT=0;if(syncState()==='sync'){_syncShow='';syncUI()}},900);st='ok'}else if(st!=='sync'){clearTimeout(_syncT);_syncT=0}
  _syncShow=st;if(st==='ok'&&SYNC_ST!=='ok')SYNC_T=Date.now();
  if(st==='off'&&SYNC_ST&&SYNC_ST!=='off')toast('🔴 Sin internet: lo que haga se guarda en este aparato y se sincroniza al volver la conexión');
  if(st==='ok'&&SYNC_ST==='off')toast('🟢 Conexión recuperada: todo sincronizado');
  SYNC_ST=st;const b=$('#syncBox');if(!b)return;
  if(b.dataset.st===st)return;b.dataset.st=st;
  b.className='sync s-'+st;b.title=SYNC_L[st][0];
  b.innerHTML=`<i></i><span class="hide-m">${SYNC_L[st][0]}</span>`;
}
window.addEventListener('online',()=>syncUI());window.addEventListener('offline',()=>syncUI());
setInterval(syncUI,15000);

function marquee(){
  document.querySelectorAll('#view .rw .mn .ell, #view .rw .mn > .t, #view .rw .mn > .s, #view .rw .mn > .m').forEach(el=>{
    if(el.querySelector('.mqi'))return;
    const d=el.scrollWidth-el.clientWidth;if(d<6)return;
    el.classList.add('mq');el.innerHTML=`<span class="mqi" style="--d:-${d+14}px;--t:${Math.min(9,Math.max(3.5,d/22+2.5)).toFixed(1)}s">${el.innerHTML}</span>`;
  });
}
let _mqT=0;window.addEventListener('resize',()=>{clearTimeout(_mqT);_mqT=setTimeout(()=>{document.querySelectorAll('#view .mqi').forEach(x=>{const p=x.parentElement;p.classList.remove('mq');p.innerHTML=x.innerHTML});marquee()},250)});

/* ---------- Dictado por voz ---------- */
let REC=null;
const mic=sel=>(window.SpeechRecognition||window.webkitSpeechRecognition)?`<button type="button" class="mic" data-act="mic" data-t="${sel}" title="Dictar por voz">🎤</button>`:'';
function micToggle(sel,btn){
  if(REC){const same=REC._sel===sel;try{REC.stop()}catch(e){}if(same)return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Este navegador no permite dictar. Use Chrome o Safari actualizado.');
  const ta=$(sel);if(!ta)return;const r=new SR();r.lang='es-CR';r.continuous=true;r.interimResults=true;r._sel=sel;
  const base=ta.value?ta.value.replace(/\s*$/,' '):'';let fin='';
  const cap=t=>t.replace(/^\s+/,'').replace(/^./,c=>base&&!/[.!?]\s*$/.test(base)?c:c.toUpperCase());
  r.onresult=e=>{let inter='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=(fin&&!/\s$/.test(fin)?' ':'')+t.trim();else inter+=' '+t}
    const el=$(sel);if(!el)return;el.value=base+cap((fin+inter).trim());el.dispatchEvent(new Event('input',{bubbles:true}))};
  const off=()=>{document.querySelectorAll('.mic.on').forEach(b=>b.classList.remove('on'));if(REC===r)REC=null;if(render._pend&&view.page==='orden')setTimeout(()=>{if(!REC)render()},300)};
  r.onend=off;r.onerror=e=>{off();if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Permita el micrófono para dictar (candado junto a la dirección → Micrófono).');else if(e.error==='no-speech')toast('No se escuchó nada. Toque 🎤 y hable.');else if(e.error==='network')toast('Para dictar se necesita internet.')};
  try{r.start();REC=r;document.querySelectorAll(`.mic[data-t="${sel}"]`).forEach(b=>b.classList.add('on'));toast('🎤 Hable… toque 🎤 otra vez para terminar')}catch(e){toast('No se pudo iniciar el dictado')}
}

/* ---------- Historial por modelo ---------- */
const modKey=e=>e?norm([e.marca,e.modelo||e.tipo].filter(Boolean).join(' ')):'';
function modStats(e,skipId){
  const k=modKey(e);if(!k||!e.marca)return null;const bs=arr(S.boletas).filter(b=>b.id!==skipId&&b.estado!=='Cancelado'&&modKey(eq(b.equipoId))===k);if(!bs.length)return null;
  const cnt=(L)=>{const m={};L.forEach(x=>{if(x)m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  return {n:bs.length,fallas:cnt(bs.flatMap(b=>b.fallas||[])),rep:cnt(bs.flatMap(b=>(b.repuestos||[]).map(l=>l.nombre))),trab:cnt(bs.flatMap(b=>[...(b.trabajos||[]),...(b.manoObra||[]).map(l=>l.d)]))};
}
function modCard(b){
  const e=eq(b.equipoId);const st=modStats(e,b.id);if(!st)return '';const nm=[e.marca,e.modelo].filter(Boolean).join(' ')||e.tipo;
  const chips=(L,cls)=>L.slice(0,5).map(([k,v])=>`<span class="pl ${cls}">${esc(k)} <b style="opacity:.7">${v}</b></span>`).join('');
  return `<div class="card"><div class="ch"><h2><span class="hem">💡</span> Lo que suele tener ${esc(nm)}</h2><span class="small muted">${st.n} orden${st.n!==1?'es':''} anterior${st.n!==1?'es':''}</span></div><div class="cp-in">
   ${st.fallas.length?`<div class="lbl">Fallas más comunes</div><div class="pillist" style="margin-bottom:10px">${chips(st.fallas,'f')}</div>`:''}
   ${st.trab.length?`<div class="lbl">Trabajos que más se le hacen</div><div class="pillist" style="margin-bottom:10px">${chips(st.trab,'w')}</div>`:''}
   ${st.rep.length?`<div class="lbl">Repuestos más usados</div><div class="pillist">${chips(st.rep,'')}</div>`:''}</div></div>`;
}

    const h=b.historial||[];const last=h[h.length-1]||{};if(!last.dev||last.dev===DEV)return;

    if(!old){if(esTaller())ping('📥 Nueva máquina para el taller'+who+(b.tecnico?' · para '+b.tecnico:''),desc,b.id);return}

  });
}

  const stop=()=>{if(!document.hidden){clearInterval(titleBlink._i);document.title=base;PCOUNT=0;try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}document.removeEventListener('visibilitychange',stop)}};document.addEventListener('visibilitychange',stop)}

const pingsSet=L=>{try{localStorage.setItem(PKEY,JSON.stringify(L.slice(-20)))}catch(e){}try{L.length?navigator.setAppBadge&&navigator.setAppBadge(L.length):navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}};
function pingCard(P,fresh){
  const k=PK[P.kind]||PK.info;let box=$('#pings');if(!box){box=document.createElement('div');box.id='pings';document.body.appendChild(box)}
  const clean=String(P.title).replace(/^\p{Extended_Pictographic}️?\s*/u,'');
  const hace=m=>m<1?'ahora':m<60?`hace ${m} min`:m<1440?`hace ${Math.floor(m/60)} h`:`hace ${Math.floor(m/1440)} d`;
  const el=document.createElement('div');el.className='ping2'+(fresh?'':' calm');el.dataset.pid=P.pid;el.style.setProperty('--c',k.c);el.style.setProperty('--c2',k.c2);
  el.innerHTML=`<div class="pg-ic"><span>${k.em}</span></div><div class="pg-tx"><div class="pg-k">${k.lbl} · <span class="pg-t">${hace(Math.floor((Date.now()-P.t)/60000))}</span></div><b>${esc(clean)}</b>${P.d?`<div class="pg-d">${esc(P.d)}</div>`:''}
    <div class="pg-act"><button class="pg-go">${P.id&&P.id!=='__fn'?'Ver orden':'Abrir'} →</button><button class="pg-x">Cerrar</button></div></div>`;
  const close=()=>{pingsSet(pingsGet().filter(x=>x.pid!==P.pid));el.classList.add('out');setTimeout(()=>{el.remove();pingMore()},350)};
  el.querySelector('.pg-go').onclick=()=>{close();if(P.fn)P.fn();else if(P.id&&P.id!=='__fn')go({page:'orden',id:P.id})};
  el.querySelector('.pg-x').onclick=close;
  box.prepend(el);pingMore();
  setInterval(()=>{const t=el.querySelector('.pg-t');if(t)t.textContent=hace(Math.floor((Date.now()-P.t)/60000))},60000);
}
function pingMore(){const box=$('#pings');if(!box)return;const n=box.querySelectorAll('.ping2:not(.out)').length;let m=box.querySelector('.pg-all');
  if(n>1){if(!m){m=document.createElement('button');m.className='pg-all';m.onclick=()=>{pingsSet([]);box.querySelectorAll('.ping2').forEach(x=>{x.classList.add('out');setTimeout(()=>x.remove(),350)});setTimeout(pingMore,400)};box.appendChild(m)}m.textContent=`Cerrar todos (${n})`;box.appendChild(m)}else if(m)m.remove()}
function ping(title,desc,id,kind){
  setTimeout(()=>{const d=typeof desc==='function'?desc():desc;kind=kind||pingKind(title);const k=PK[kind]||PK.info;
    const P={pid:uid(),title,d:d||'',id:typeof id==='string'?id:'__fn',kind,t:Date.now()};
    if(typeof id!=='function')pingsSet([...pingsGet(),P]);else P.fn=id;
    pingCard(P,true);
    chime(k.notes);flashScreen(k.c);PCOUNT++;titleBlink(String(title).replace(/^\p{Extended_Pictographic}️?\s*/u,''));
    try{navigator.vibrate&&navigator.vibrate(kind==='asignada'?[200,90,200,90,300]:[140,80,140])}catch(e){}
    sysNotif(title,d,typeof id==='string'?id:'');
  },300);
}

document.addEventListener('click',e=>{
  const wa=e.target.closest('a[href^="https://wa.me/"]');if(wa){e.preventDefault();e.stopPropagation();const pw=wa.dataset.act==='pWa';waPreview(wa.href,pw?()=>A.pWa({}):null);return}
  const a=e.target.closest('a[href]');if(a&&a.getAttribute('href')!=='#'&&!a.dataset.act)return; // enlaces reales
  if(e.target.id==='more')return closeMore();
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='pWa'){A.pWa(t.dataset);return}
  e.preventDefault();const f=A[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui){UI[t.dataset.ui]=t.value;if(t.id==='qGlobal'){render()}else render();return}
  if(t.dataset.wq!=null&&W){W.qc=t.value;const q=norm(W.qc);const rs=q?arr(S.clientes).filter(c=>norm([c.nombre,c.telefono,c.telefono2,c.cedula].join(' ')).includes(q)).slice(0,12):arr(S.clientes).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);$('#wqRes').innerHTML=wCliRes(rs,q);return}
  if(t.dataset.w&&W){const [o,k]=t.dataset.w.split('.');(o==='d'?W.d:W[o])[k]=t.value;return}
  if(t.dataset.tr&&TR){TR[t.dataset.tr]=t.value;dirtyTrab();return}
  if(t.dataset.cnt){CNT[t.dataset.cnt]=t.value===''?'':String(Math.max(0,num(t.value)));if(CNT[t.dataset.cnt]==='')delete CNT[t.dataset.cnt];cntSave();cntRow(t.dataset.cnt);return}
  if(t.dataset.ef&&EF){EF[t.dataset.ef]=t.value;return}
  if(t.dataset.rf&&RF){RF[t.dataset.rf]=t.value;return}
  if(t.dataset.nf&&RP&&RP.nf){RP.nf[t.dataset.nf]=t.value;if(t.dataset.nf==='nombre')RP.nf._t=true;if(['entra','usa'].includes(t.dataset.nf)){const i=$('#nfInfo');if(i)i.innerHTML=nfInfo()}return}
  if(t.dataset.cpf){const c=CPR[t.dataset.cpf];c._f=t.value;const box=$('#cp_'+t.dataset.cpf);if(box){box.outerHTML=chipPick(t.dataset.cpf);const i=document.querySelector(`[data-cpf="${t.dataset.cpf}"]`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}return}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset.cpin){e.preventDefault();cpAdd(t.dataset.cpin,t.value);return}
  if(e.key==='Enter'&&t.id==='revNew'){e.preventDefault();document.querySelector('[data-act=revAdd]')?.click();return}
  if(e.key==='Enter'&&t.id==='ckNew'){e.preventDefault();A.ckAdd();return}
  if(e.key==='Enter'&&t.id==='whoNew'){e.preventDefault();A.whoAdd();return}
  if(e.key==='Enter'&&t.dataset.catadd){e.preventDefault();A.catAdd({k:t.dataset.catadd});return}
  if(e.key==='Enter'&&t.id==='wq'){e.preventDefault();const f=document.querySelector('#wqRes .pick');if(f)f.click();return}
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(UI.q)A.clearQ();closeMore()}
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(t.tagName)&&innerWidth>860){e.preventDefault();$('#qGlobal').focus()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files[0])importFile(t.files[0]);
  if(t.dataset.resp)A.respSet({k:t.dataset.resp,v:+t.value});
  if(t.id==='logoFile'&&t.files[0])loadLogo(t.files[0]);
  if(t.dataset.perp!=null||t.dataset.pere!=null){if(!isAdmin())return toast('Solo el administrador');const L=personal();const i=+(t.dataset.perp??t.dataset.pere);if(L[i]){if(t.dataset.perp!=null)L[i].puesto=t.value;else L[i].email=t.value.trim();savePersonal(L).then(()=>{toast('Personal actualizado');render()})}}
  if(t.dataset.pon){UI.pOn[t.dataset.pon]=t.checked;render()}
  if(t.dataset.pprov){const k=t.dataset.pprov,v=t.value;(async()=>{if(k.startsWith('m:')){const m=S.porpedir[k.slice(2)];if(m)await put('porpedir',{...m,proveedor:v})}else{const r=rep(k.slice(2));if(r)await put('repuestos',{...r,proveedor:v})}render()})()}
  if(t.dataset.ptel!=null){const c=CAT();c.proveedores=[...(c.proveedores||[])];const i=+t.dataset.ptel;if(c.proveedores[i]){c.proveedores[i]={...c.proveedores[i],tel:t.value.trim()};saveCat(c).then(()=>{toast('Teléfono guardado');render()})}}
});

async function importFile(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Archivo no válido')}
  if(!j||!COLS.some(c=>j[c]))return toast('El archivo no parece un respaldo del taller');
  const n=COLS.reduce((s,c)=>s+Object.keys(j[c]||{}).length,0);
  confirmBox(`Se importarán ${n} registros. Los que tengan el mismo identificador se reemplazan. ¿Continuar?`,async()=>{
    $('#cYes').textContent='Importando…';
    if(j.config)await saveCfg(j.config);if(j.catalogo)await saveCat(j.catalogo);
    for(const c of COLS)for(const o of Object.values(j[c]||{}))if(o&&o.id)await put(c,o);
