<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="firebase-config.js"></script>
<meta name="color-scheme" content="light dark">
<script>(function(){var t;try{t=localStorage.getItem("taller_theme")}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<title>Taller — Recepción y servicio técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f5f2;--surface:#fff;--ink:#17201a;--ink2:#3f4a42;--muted:#78827a;--line:#e3e6e0;--line2:#eef0ec;--soft:#f8f9f6;
  --pri:#15803d;--pri-d:#14532d;--pri-l:#dcfce7;--pri-50:#f0fdf4;
  --acc:#f59e0b;--acc-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;--blue:#2563eb;--blue-l:#dbeafe;
  --side:#0e1a13;--r:14px;--sh:0 1px 2px rgba(16,24,18,.05),0 1px 3px rgba(16,24,18,.06);--sh2:0 10px 30px rgba(16,24,18,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h1{font-size:24px;font-weight:800}h2{font-size:16px;font-weight:700}h3{font-size:14px;font-weight:700}
a{color:var(--pri)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--side);color:#cfd8d1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 18px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.bname{color:#fff;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bsub{font-size:11.5px;color:#7f9184}
.recv{margin:4px 14px 14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:11px;padding:11px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(21,128,61,.35)}
.recv:hover{background:#16a34a}
.nav{padding:0 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#56665a;padding:12px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:14px;font-weight:500;color:#aab7ad;transition:.12s}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(34,197,94,.14);color:#fff}
.nav button.on svg{color:#4ade80}
.nb{margin-left:auto;background:rgba(255,255,255,.1);color:#e5ece7;font-size:11px;padding:1px 8px;border-radius:20px;font-weight:600}
.sfoot{padding:14px 18px;font-size:11px;color:#56665a;border-top:1px solid rgba(255,255,255,.06)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(244,245,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 28px;min-height:62px}
.tsearch{position:relative;flex:1;max-width:460px}
.tsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tsearch input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.tsearch input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.mtitle{display:none}
.content{padding:24px 28px 110px;max-width:1440px;width:100%}
@media (min-width:1500px){.content{padding:28px 40px 110px}}
.status{display:none;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.status.warn{display:block;background:var(--acc-l);color:#854d0e}
.status.err{display:block;background:var(--red-l);color:var(--red)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:10px}
.back:hover{color:var(--ink)}
/* ---------- base ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cp-in{padding:18px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.ch h2{flex:1;display:flex;align-items:center;gap:8px}
.ch h2 svg{color:var(--pri)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g4.g5s{grid-template-columns:repeat(5,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:.12s}
.btn:hover{background:var(--soft);border-color:#cfd4cc}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:#16a34a}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.d{color:var(--red);border-color:#f5c2c2}.btn.d:hover{background:var(--red-l)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg.i{width:16px;height:16px}
.ib{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em}
.tag.n{background:#dcfce7;color:#166534}.tag.u{background:#ffedd5;color:#9a3412}.tag.urg{background:var(--red-l);color:var(--red)}.chipbtn{border:1px dashed var(--line);background:var(--soft);border-radius:8px;padding:2px 8px;font:600 12px ui-monospace,monospace;cursor:pointer;margin-top:3px;color:inherit}.tag.gar{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.st-ok{background:#dcfce7;color:#166534}.st-low{background:#fef3c7;color:#92400e}.st-out{background:#fee2e2;color:#991b1b}
.num{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--pri);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--muted);padding:38px 16px}
.empty .ei{width:52px;height:52px;border-radius:14px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:24px;color:var(--muted)}
.empty b{display:block;color:var(--ink2);margin-bottom:4px}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;min-width:0}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.fbar .inp{flex:1;min-width:200px}
.seg{display:inline-flex;background:#e9ece6;border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.fchip{all:unset;cursor:pointer;flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.fchip .c{color:var(--muted);font-weight:500}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}.fchip.on .c{color:#c9d1cb}
/* list rows */
.rows{display:flex;flex-direction:column}
.rw{display:flex;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--pri-50)}
.rw .mn{flex:1;min-width:0}
.rw .t{font-weight:700}
.rw .m{color:var(--muted);font-size:13px}
.rw .r{text-align:right;flex-shrink:0;font-size:12.5px;color:var(--muted)}
.ticon{width:42px;height:42px;border-radius:11px;background:var(--pri-50);border:1px solid #d7ecd9;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#86efac,#15803d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.ck{cursor:pointer}table.t tbody tr.ck:hover{background:var(--pri-50)}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* stats */
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.12s}
.stat:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.stat .si{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .n{font-size:26px;font-weight:800;line-height:1.05}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
/* kv */
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}.kv dd{margin:0;word-break:break-word}
.lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.pillist{display:flex;flex-wrap:wrap;gap:6px}
.pl{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.pl.f{background:var(--acc-l);border-color:#fde68a;color:#854d0e}
.pl.w{background:var(--pri-50);border-color:#bbf7d0;color:#166534}
/* chips picker */
.cp{display:flex;flex-wrap:wrap;gap:7px}
.cpc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.1s;user-select:none}
.cpc:hover{border-color:#9fd3ad;background:var(--pri-50)}
.cpc.on{border-color:var(--pri);background:var(--pri);color:#fff}
.cpc.add{border-style:dashed;color:var(--pri);background:transparent}
.cpc .em{font-size:16px;line-height:1}
.cpadd{display:inline-flex;gap:6px;align-items:center}
.cpadd input{padding:7px 10px;border:1.5px solid var(--pri);border-radius:10px;outline:none;width:180px}
.cpfil{margin-bottom:8px;width:100%;max-width:280px}
.cpx{all:unset;cursor:pointer;margin-left:6px;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--red);background:var(--red-l);opacity:.85;touch-action:manipulation}.cpx:hover{opacity:1;background:var(--red);color:#fff}.catc{cursor:pointer}
/* form */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.f>label,.fl{font-size:13px;font-weight:600;color:var(--ink2)}
.f>label .opt,.fl .opt{color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;outline:none}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.err{color:var(--red);font-size:13px;font-weight:600}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(10,18,12,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 14px}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 56px);animation:pop .18s ease-out}
.mbox.lg{max-width:860px}.mbox.sm{max-width:440px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:.5}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.mh h2{flex:1;font-size:17px}
.mb{padding:20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* wizard */
.steps{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line2);overflow-x:auto}
.stp{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:5px 10px 5px 5px;border-radius:20px;flex-shrink:0}
.stp b{width:24px;height:24px;border-radius:50%;background:var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.stp.on{color:var(--ink);background:var(--pri-50)}.stp.on b{background:var(--pri);color:#fff}
.stp.ok b{background:var(--pri-l);color:var(--pri)}
.stp.dis{cursor:default;opacity:.6}
.sect{margin-bottom:22px}
.sect>.fl{display:block;margin-bottom:9px}
.pick{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;width:100%}
.pick:hover{border-color:#9fd3ad}
.pick.on{border-color:var(--pri);background:var(--pri-50)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.chosen{display:flex;gap:12px;align-items:center;border:1.5px solid var(--pri);background:var(--pri-50);border-radius:12px;padding:12px 14px}
.sum{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum>div{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.sum>div:last-child{border-bottom:0}
.sum dt{color:var(--muted)}
/* order */
.ohead{padding:20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.onum{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--muted)}
.otitle{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.pipe{display:flex;gap:4px;padding:0 20px 18px;overflow-x:auto}
.pp{all:unset;cursor:pointer;flex:1;min-width:92px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-top:10px;border-top:4px solid var(--line);transition:.12s}
.pp:hover{color:var(--ink)}
.pp.done{border-color:var(--pri);color:var(--pri)}
.pp.cur{border-color:var(--c);color:var(--c)}
.lines .ln{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.lines .ln:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.qty button:hover{background:var(--soft)}
.qty span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:6px 18px 14px}
.tl li{position:relative;padding:8px 0 8px 24px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:4px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c,#9aa39c);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.tl li::after{content:"";position:absolute;left:8px;top:28px;bottom:-6px;width:2px;background:var(--line2)}
.tl li:last-child::after{display:none}
/* kanban */
.kb{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kc{flex:0 0 272px;background:#eceee9;border-radius:14px;padding:10px;min-height:120px}
.kc.over{outline:2px dashed var(--pri);outline-offset:-2px}
.kch{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:13px}
.kch .c{margin-left:auto;color:var(--muted);font-weight:600}
.kcard{background:#fff;border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;border:1px solid transparent}
.kcard:hover{border-color:#9fd3ad}
.kcard[draggable=true]{cursor:grab}
/* machine cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.12s}
.mcard:hover{border-color:#9fd3ad;box-shadow:var(--sh2)}
.last{font-size:12.5px;background:var(--acc-l);color:#854d0e;border-radius:8px;padding:6px 9px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:12px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri)}
.vis{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.vis .bx{font-size:13.5px;margin-top:6px}
.vis .bx b{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}
/* role */
.role{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;border:0;white-space:nowrap}
.role.mec{background:var(--blue-l);color:#1e40af}.role.adm{background:var(--acc-l);color:#92400e}
.lockn{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px dashed #cfd4cc;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
mark{background:#fef08a;border-radius:3px;padding:0 1px}
.ckl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ckr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:13.5px}
.ckr:last-child{border-bottom:0}.ckr>span{flex:1;min-width:0}
.ckb{display:inline-flex;gap:4px;flex-shrink:0}
.ckb button{all:unset;cursor:pointer;padding:4px 10px;border-radius:7px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.ckb button.on.ok{background:#dcfce7;border-color:#86efac;color:#166534}
.ckb button.on.mal{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.ckb button.on.na{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.who{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 4px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.who .av{width:26px;height:26px;font-size:11px}
.who.none{border-style:dashed;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90;box-shadow:var(--sh2);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.bnav{display:none}
.no-recv [data-act=recibir],.no-recv [data-act=rRecibir],.no-recv [data-act=entregar]{display:none!important}
.no-taller [data-act=addRep],.no-taller [data-act=ppAdd][data-id],.no-taller .qty button,.no-taller [data-act=rmLine],.no-taller [data-act=tRecibir],.no-taller [data-act=listo]{display:none!important}
.more{display:none}
/* printable */
.pb{font:12.5px/1.45 "Plus Jakarta Sans",Arial,sans-serif;color:#111;background:#fff}
.pb .hd{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid #15803d;padding-bottom:12px;margin-bottom:14px}
.pb .hd img{height:60px;max-width:150px;object-fit:contain}
.pb .tn{font-size:17px;font-weight:800;color:#14532d}
.pb .nbx{border:2px solid #15803d;border-radius:10px;padding:6px 14px;text-align:center}
.pb .nbx small{display:block;font-size:9.5px;letter-spacing:.08em;color:#555}
.pb .nbx b{font:700 18px "JetBrains Mono",monospace;color:#14532d}
.pb h4{margin:12px 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#15803d}
.pb .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pb .bx{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.pb p{margin:2px 0}
.pb table{width:100%;border-collapse:collapse;font-size:12px}
.pb th{text-align:left;background:#f0fdf4;padding:5px 7px;font-size:10px;text-transform:uppercase;border:1px solid #ddd}
.pb td{padding:5px 7px;border:1px solid #ddd}
.pb .terms{font-size:10px;white-space:pre-wrap;color:#333;border:1px solid #ddd;padding:8px;border-radius:6px}
.pb .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px;text-align:center;font-size:11px}
.pb .sig div{border-top:1px solid #333;padding-top:4px}
.pb .ft{text-align:center;color:#888;font-size:9.5px;margin-top:14px}
.pb .ckg{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;font-size:11.5px}.pb .ckg div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #ccc;padding:2px 0}.pb .ckg span{white-space:nowrap}
.pb .wl{border-bottom:1px solid #aaa;height:20px}
#pings{position:fixed;top:72px;right:16px;z-index:95;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px))}
.ping{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:10px 12px;box-shadow:var(--sh2);animation:pop .2s ease-out}
.ping .pi{width:34px;height:34px;border-radius:9px;background:var(--pri-50);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nstep{display:flex;gap:12px;align-items:center;margin:0 20px 18px;padding:12px 14px;border-radius:12px;background:var(--pri-50);border:1px solid #bbf7d0;flex-wrap:wrap}
.nstep.wait{background:var(--soft);border-color:var(--line)}
/* ---------- mobile ---------- */
@media (max-width:860px){
  .side{display:none}
  .top{padding:9px 14px;gap:8px}
  .mtitle{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;min-width:0;flex:1}
  .mtitle .logo{width:32px;height:32px;border-radius:9px;font-size:12px}
  .mtitle span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tsearch{display:none}.tsearch.open{display:block;position:absolute;left:10px;right:10px;top:9px;max-width:none}
  .content{padding:16px 14px 110px}
  .g2,.g3{grid-template-columns:1fr}.g4,.g4.g5s{grid-template-columns:1fr 1fr}.g5s>:last-child{grid-column:1/-1}
  h1{font-size:21px}
  .stat{padding:13px;gap:10px}.stat .si{width:36px;height:36px}.stat .n{font-size:21px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);flex:1;padding:4px 0}
  .bnav button.on{color:var(--pri)}
  .bnav .fabb{flex:0 0 auto;margin-top:-26px}
  .bnav .fabb span{width:56px;height:56px;border-radius:18px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(21,128,61,.4)}
  .bnav .fabb span svg{width:26px;height:26px}
  .more{position:fixed;inset:0;background:rgba(10,18,12,.45);z-index:55;align-items:flex-end}
  .more.open{display:flex}
  .more .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 12px calc(84px + env(safe-area-inset-bottom))}
  .more .sheet button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:13px 12px;border-radius:10px;font-weight:600;width:calc(100% - 24px)}
  .more .sheet button:hover{background:var(--soft)}
  .modal{padding:0}
  .mbox,.mbox.lg,.mbox.sm{max-height:100vh;height:100%;border-radius:0;max-width:none}
  .kv{grid-template-columns:105px 1fr}
  .sum>div{grid-template-columns:110px 1fr}
  .rw{padding:12px 14px}
  .hide-m{display:none!important}
  .rwb{flex-wrap:wrap}.rwb .r{width:100%;justify-content:flex-end!important}
  #toast{bottom:92px}
  .pb .two{grid-template-columns:1fr}
}

/* ================== TEMA VIDRIO + COLOR ================== */
html{color-scheme:light;
 --bg:#eef3f0;--surface:rgba(255,255,255,.66);--surface-hi:rgba(255,255,255,.92);--field:rgba(255,255,255,.78);
 --glass-b:rgba(255,255,255,.75);--line:rgba(20,40,28,.10);--line2:rgba(20,40,28,.06);--soft:rgba(20,40,28,.04);
 --warn:#b45309;--blob-o:.55;--glow:rgba(34,197,94,.35);--side:rgba(10,22,16,.86);--tlbg:#f3f6f4;
 --sh:0 1px 2px rgba(16,24,18,.04),0 8px 24px rgba(16,24,18,.06);--sh2:0 18px 40px rgba(16,24,18,.14)}
html[data-theme=dark]{color-scheme:dark;
 --bg:#060a09;--surface:rgba(20,28,25,.58);--surface-hi:rgba(30,40,36,.92);--field:rgba(255,255,255,.05);
 --glass-b:rgba(255,255,255,.08);--ink:#eef5f1;--ink2:#cbd6cf;--muted:#8b9b92;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.06);--soft:rgba(255,255,255,.05);
 --pri:#22c55e;--pri-d:#86efac;--pri-l:rgba(34,197,94,.20);--pri-50:rgba(34,197,94,.09);
 --acc:#fbbf24;--acc-l:rgba(251,191,36,.15);--red:#f87171;--red-l:rgba(248,113,113,.15);--blue:#60a5fa;--blue-l:rgba(96,165,250,.15);
 --warn:#fbbf24;--blob-o:.5;--glow:rgba(34,197,94,.45);--side:rgba(8,14,12,.62);--tlbg:#0b1210;
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);--sh2:0 20px 50px rgba(0,0,0,.5)}
html,body{background:var(--bg)}
body{transition:background .3s}
/* fondo animado */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--blob-o);will-change:transform}
.bgfx .b1{background:radial-gradient(circle,#22c55e 0,transparent 62%);left:-25vmax;top:-30vmax;animation:drift1 26s ease-in-out infinite alternate}
.bgfx .b2{background:radial-gradient(circle,#f97316 0,transparent 62%);right:-30vmax;top:-10vmax;animation:drift2 30s ease-in-out infinite alternate;opacity:calc(var(--blob-o)*.8)}
.bgfx .b3{background:radial-gradient(circle,#06b6d4 0,transparent 62%);left:10vmax;bottom:-40vmax;animation:drift3 34s ease-in-out infinite alternate}
.bgfx .b4{background:radial-gradient(circle,#a855f7 0,transparent 62%);right:-20vmax;bottom:-35vmax;animation:drift1 38s ease-in-out infinite alternate-reverse;opacity:calc(var(--blob-o)*.7)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(127,127,127,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%)}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-16vmax) scale(1.1)}}
/* vidrio */
.card,.mbox,.kc,.mcard,.vis,.ping,.pick,.sum,.ckl{background:var(--surface);border:1px solid var(--glass-b);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.card{border-radius:18px;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.ch{border-bottom-color:var(--line2)}
.ch h2 .hem,.hem{font-size:18px;line-height:1;display:inline-block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.side{background:var(--side);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-right:1px solid rgba(255,255,255,.06)}
.top{background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid var(--line2)}
.nav button{transition:background .2s,color .2s,transform .2s}
.nav button:hover{transform:translateX(3px)}
.nav button.on{background:linear-gradient(90deg,rgba(34,197,94,.28),rgba(34,197,94,.06));box-shadow:inset 3px 0 0 #4ade80}
.nem{font-size:17px;width:22px;text-align:center;line-height:1;transition:transform .25s}
.nav button:hover .nem{transform:scale(1.2) rotate(-8deg)}
.recv,.btn.p{background:linear-gradient(135deg,#22c55e,#10b981 55%,#0d9488);border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}
.recv:hover,.btn.p:hover{background:linear-gradient(135deg,#34d399,#10b981 55%,#0f766e);filter:brightness(1.05)}
.btn{background:var(--field);border-color:var(--line);color:var(--ink2);border-radius:12px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s}
.btn:hover{background:var(--surface-hi);border-color:var(--line)}
.btn:active,.cpc:active,.fchip:active,.stat:active,.rw:active,.pick:active{transform:scale(.96)}
.btn.d{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.btn.d:hover{background:var(--red-l)}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.ib:hover{background:var(--soft)}
.tsearch input,.inp,.sel,.f input,.f select,.f textarea,.cpadd input{background:var(--field);border-color:var(--line);transition:border-color .2s,box-shadow .25s,background .2s}
.tsearch input:focus,.inp:focus,.sel:focus,.f input:focus,.f select:focus,.f textarea:focus,.cpadd input:focus{border-color:var(--pri);background:var(--surface-hi);box-shadow:0 0 0 4px rgba(34,197,94,.18),0 6px 20px rgba(34,197,94,.15)}
.seg{background:var(--soft)}.seg button.on{background:var(--surface-hi)}
.fchip{background:var(--field);border-color:var(--line);transition:transform .15s,background .2s}
.fchip.on{background:linear-gradient(135deg,#22c55e,#0d9488);border-color:transparent;color:#fff}.fchip.on .c{color:rgba(255,255,255,.8)}
.cpc{background:var(--field);border-color:var(--line);border-radius:12px;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.cpc:hover{border-color:var(--pri);background:var(--pri-50)}
.cpc.on{background:linear-gradient(135deg,#22c55e,#0d9488);border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--glow)}
.cpc.add{background:transparent;border-color:color-mix(in srgb,var(--pri) 55%,transparent)}
@keyframes chipOn{0%{transform:scale(.88)}100%{transform:none}}
.rw{transition:background .2s}
.rw:hover{background:var(--pri-50)}
.ticon{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(6,182,212,.14));border:1px solid var(--glass-b);border-radius:13px}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--c,#22c55e),transparent 65%);opacity:.22;transition:transform .4s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.stat:hover::before{transform:scale(1.3)}
.stat .si{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff))!important;font-size:21px;border-radius:14px;box-shadow:0 8px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.stat .n{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--c) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge.est{color:var(--c);background:var(--b);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.badge .be{font-size:12px;line-height:1}
html[data-theme=dark] .badge.est{color:color-mix(in srgb,var(--c) 55%,#fff)}
.pp.cur{text-shadow:0 0 12px color-mix(in srgb,var(--c) 50%,transparent)}
.pp.done{border-color:var(--pri)}
.tl li::before{box-shadow:0 0 0 3px var(--tlbg),0 0 0 4px var(--line),0 0 10px var(--c,transparent)}
.kc{border-radius:18px}
.kcard{background:var(--surface-hi);border:1px solid var(--glass-b);transition:transform .2s,border-color .2s}
.kcard:hover{transform:translateY(-2px);border-color:var(--pri)}
.mcard{transition:transform .25s,box-shadow .25s,border-color .25s}
.mcard:hover{transform:translateY(-3px);border-color:var(--pri)}
.pick:hover{border-color:var(--pri)}
.pick.on,.chosen{border-color:var(--pri);background:var(--pri-50);box-shadow:0 0 0 4px rgba(34,197,94,.10)}
.who{background:var(--field);border-color:var(--line);transition:transform .15s}
.who.none{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(34,197,94,.15)}}
.av{background:linear-gradient(135deg,#34d399,#0d9488 60%,#6366f1)}
.modal{background:rgba(4,10,8,.38);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);animation:fadeIn .2s ease-out}
.mbox{background:var(--surface-hi);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
@keyframes fadeIn{from{opacity:0}}
.stp.on b{background:linear-gradient(135deg,#22c55e,#0d9488);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.empty .ei{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(168,85,247,.12));border:1px solid var(--glass-b);font-size:26px;width:60px;height:60px;border-radius:18px;animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px) rotate(-4deg)}}
#toast{background:color-mix(in srgb,#0b1410 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:16px}
#toast.show{animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{transform:translate(-50%,20px) scale(.9);filter:blur(4px)}}
.ping{border-left:4px solid var(--pri)}
.status{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:14px}
/* colores de etiquetas en oscuro */
html[data-theme=dark] .tag.n,html[data-theme=dark] .st-ok,html[data-theme=dark] .ckb button.on.ok{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.35)}
html[data-theme=dark] .tag.u{background:rgba(249,115,22,.16);color:#fdba74}
html[data-theme=dark] .st-low,html[data-theme=dark] .pl.f,html[data-theme=dark] .last,html[data-theme=dark] .status.warn,html[data-theme=dark] .role.adm{background:rgba(251,191,36,.14);color:#fcd34d;border-color:rgba(251,191,36,.3)}
html[data-theme=dark] .st-out,html[data-theme=dark] .ckb button.on.mal{background:rgba(248,113,113,.16);color:#fca5a5;border-color:rgba(248,113,113,.35)}
html[data-theme=dark] .ckb button.on.na{background:rgba(148,163,184,.14);color:#cbd5e1;border-color:rgba(148,163,184,.3)}
html[data-theme=dark] .pl.w{background:rgba(34,197,94,.12);color:#86efac;border-color:rgba(34,197,94,.3)}
html[data-theme=dark] .role.mec{background:rgba(96,165,250,.16);color:#93c5fd}
html[data-theme=dark] mark{background:rgba(250,204,21,.35);color:#fff}
html[data-theme=dark] .lockn{border-color:rgba(255,255,255,.15)}
html[data-theme=dark] .nstep{border-color:rgba(34,197,94,.3)}
html[data-theme=dark] .ticon{border-color:rgba(255,255,255,.08)}
html[data-theme=dark] table.t th{background:rgba(255,255,255,.04)}
html[data-theme=dark] .pb{color:#111}
/* animación al cambiar de página */
.enter>*,.enter>.grid>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2),.enter>.grid>*:nth-child(2){animation-delay:.06s}
.enter>*:nth-child(3),.enter>.grid>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4),.enter>.grid>*:nth-child(4){animation-delay:.18s}
.enter>*:nth-child(n+5),.enter>.grid>*:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* hero de inicio */
.hero{display:flex;align-items:center;gap:16px;padding:22px 24px;margin-bottom:16px;overflow:hidden;position:relative;background:linear-gradient(120deg,color-mix(in srgb,#22c55e 16%,var(--surface)),color-mix(in srgb,#f97316 12%,var(--surface)) 60%,color-mix(in srgb,#06b6d4 14%,var(--surface)))}
.hero h1{font-size:28px}.hero .gt{background:linear-gradient(90deg,var(--ink),#16a34a 55%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=dark] .hero .gt{background-image:linear-gradient(90deg,#f0fdf4,#4ade80 55%,#fb923c)}
.hero .wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:none}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.hero .sub{color:var(--muted);margin-top:4px}
.hero-t{flex:1;min-width:0;position:relative;z-index:1}
.hero-saw{width:230px;flex-shrink:0;position:relative;z-index:1}
/* motosierra */
.saw{width:100%;height:auto;overflow:visible;display:block}
.saw .sbody{animation:buzz .09s linear infinite}
.saw .chain{animation:chain .32s linear infinite}
.saw .sprk{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.saw .dust{transform-box:fill-box;opacity:0;animation:dust 1.1s ease-out infinite}
.saw .d2{animation-delay:.2s}.saw .d3{animation-delay:.45s}.saw .d4{animation-delay:.65s}.saw .d5{animation-delay:.85s}
.saw .smoke{transform-box:fill-box;transform-origin:center;opacity:0;animation:smoke 2.4s ease-out infinite}
.saw .smoke.s2{animation-delay:1.2s}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.5px)}50%{transform:translate(-.4px,.5px)}75%{transform:translate(.5px,.3px)}}
@keyframes chain{to{stroke-dashoffset:-20}}

function CAT(){
  const c={...DEF_CAT,...(CATD||{})};
  if(!CATD){ // primera vez: tomar listas de la versión anterior
    if(CFG.tecnicos)c.tecnicos=list(CFG.tecnicos);
    if(CFG.tiposEquipo)c.tipos=uniq([...c.tipos,...list(CFG.tiposEquipo)]);
    if(CFG.accesorios)c.accesorios=uniq([...c.accesorios,...list(CFG.accesorios)]);
    if(CFG.categorias)c.categorias=uniq([...c.categorias,...list(CFG.categorias)]);
  }
  return c;
}

function catModelos(marca,tipo){
  const ms=CAT().modelos.filter(m=>(!marca||norm(m.m)===norm(marca))&&(!tipo||!m.t||norm(m.t)===norm(tipo))).map(m=>m.n);
  const fromEq=arr(S.equipos).filter(e=>(!marca||norm(e.marca)===norm(marca))&&(!tipo||norm(e.tipo)===norm(tipo))).map(e=>e.modelo);
  return uniq([...ms,...fromEq]);
}
async function saveCat(c){

}
async function catAdd(key,val){

  if(c[key].some(x=>norm(x)===norm(val)))return true;
  c[key]=[...c[key],val];return saveCat(c);
}
async function catAddModelo(m,t,n){
  n=String(n||'').trim();if(!n)return false;const c=CAT();
  if(c.modelos.some(x=>norm(x.m)===norm(m)&&norm(x.n)===norm(n)))return true;

const dd=(a,b)=>Math.round((new Date(String(b).slice(0,10)+'T00:00:00')-new Date(String(a).slice(0,10)+'T00:00:00'))/864e5);
function prevInfo(b,fallasDraft){
  if(!b||!b.equipoId)return null;
  const prev=arr(S.boletas).filter(x=>x.equipoId===b.equipoId&&x.id!==b.id&&x.estado!=='Cancelado'&&(!b.numero||num(x.numero)<num(b.numero)))
    .sort((a,z)=>String(z.fechaIngreso).localeCompare(String(a.fechaIngreso))||num(z.numero)-num(a.numero));
  const p=prev[0];if(!p)return null;
  const ref=b.fechaIngreso||today();
  const fin=p.fechaEntrega||'';
  const enGar=p.estado==='Entregado'&&fin&&num(p.garantiaDias??CFG.garantia)>0&&dd(fin,ref)>=0&&dd(fin,ref)<=num(p.garantiaDias??CFG.garantia);
  const mine=(fallasDraft||b.fallas||[]).map(norm);
  const same=(p.fallas||[]).filter(f=>mine.includes(norm(f)));
  return {p,enGar,same,dias:fin?dd(fin,ref):dd(p.fechaIngreso,ref),veces:prev.length};
}

const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const respFrec=()=>CFG.respFrec||'semana',respDia=()=>CFG.respDia==null?5:+CFG.respDia,respHora=()=>CFG.respHora==null?12:+CFG.respHora;
function viernesMedioDia(){const d=new Date(),h=respHora();
  if(respFrec()==='dia'){const f=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0,0);if(f>d)f.setDate(f.getDate()-1);return f.getTime()}
  const k=(d.getDay()-respDia()+7)%7;const f=new Date(d.getFullYear(),d.getMonth(),d.getDate()-k,h,0,0);if(f>d)f.setDate(f.getDate()-7);return f.getTime()}
const hLbl=h=>h===0?'12 a. m.':h<12?h+' a. m.':h===12?'12 m. d.':(h-12)+' p. m.';

let RB=null;
const rbDur=()=>60e3+Math.random()*60e3;
const RB_LOW=(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3;
function rbXmas(){try{const v=localStorage.getItem('rbXmas');if(v==='on')return true;if(v==='off')return false}catch(e){}const d=new Date(),m=d.getMonth()+1,day=d.getDate();return (m===11&&day>=15)||m===12||(m===1&&day<=6)}
function rbBuild(){const f=document.createElement('div');f.id='rbFloat';if(rbXmas())f.classList.add('xmas');
  f.innerHTML=`<div class="rbbot" id="rbBot"><div class="rbtilt"><div class="rbbob">${robotSVG()}</div></div></div><button class="rbbub" id="rbBub" type="button"></button>`;
  document.body.appendChild(f);
  RB={f,bot:f.querySelector('#rbBot'),bub:f.querySelector('#rbBub'),x:innerWidth-200,y:innerHeight-260,dir:-1,tx:0,ty:0,act:RB_ACTS[Math.floor(Math.random()*4)],ph:'fly',tAct:Date.now()+rbDur(),tPh:0,last:0,msgI:0,tMsg:Date.now()+4000,bubOn:false,alert:null,chat:false};
  RB.bot.dataset.act=RB.act;rbPick();
  RB.bot.addEventListener('click',e=>{e.stopPropagation();rbChat(!RB.chat)});
  RB.bub.onclick=e=>{e.stopPropagation();const a=RB.alert;if(a&&a.go){go(a.go);rbHideBub()}else rbChat(true)};
  addEventListener('resize',()=>{if(!RB)return;rbPick();const {w,h}=rbSize();if(RB.x>innerWidth-w*.5||RB.y>innerHeight-h*.5||RB.x<-w*.5){RB.x=RB.tx;RB.y=RB.ty}});
  requestAnimationFrame(rbLoop)}
function rbSize(){return {w:RB.bot.offsetWidth||145,h:RB.bot.offsetHeight||112}}
function rbPick(){const W=innerWidth,H=innerHeight,ph=W<=860,{w,h}=rbSize();
  if(RB.chat){const p=$('#rbChat');const r=p?p.getBoundingClientRect():{left:W-380,top:H-400};
    if(ph){RB.tx=W-w*.95;RB.ty=r.top-h*.92}else{RB.tx=r.left-w*.88;RB.ty=Math.max(70,Math.min(H-h-10,r.top+40))}RB.dirLock=ph?-1:1;return}
  RB.dirLock=0;const top=ph?H*.4:Math.max(90,H*.28),bot=H-h-(ph?96:12);
  const side=Math.random();let x;if(ph)x=side<.5?Math.random()*W*.18-w*.12:W-w*.88-Math.random()*W*.18;else x=side<.35?Math.random()*W*.3:W*.45+Math.random()*(W*.55-w*.9);
  RB.tx=Math.max(-w*.12,Math.min(W-w*.88,x));RB.ty=Math.max(top,Math.min(bot,top+Math.random()*(bot-top)))}
function rbSetAct(a,silent){RB.act=a;RB.bot.dataset.act=a;RB.bot.classList.remove('cut','fell');
  if(!silent){RB.bot.classList.remove('swap');void RB.bot.offsetWidth;RB.bot.classList.add('swap');rbSay({t:RB_TXT[a]},4500)}}
function rbHideBub(){RB.bub.className='rbbub';RB.bubOn=false;RB.tMsg=Date.now()+9000}
function rbSay(m,ms){if(RB.chat)return;RB.alert=m;RB.bub.innerHTML=esc(m.t)+(m.go?' <b>›</b>':'');RB.bub.className='rbbub on'+(m.sev==='r'?' urg':'');RB.bubOn=true;RB.bubW=0;RB.tHide=Date.now()+(ms||8000);if(m.sev==='r'){RB.bot.classList.remove('jump');void RB.bot.offsetWidth;RB.bot.classList.add('jump')}}
function rbMsgs(){const L=[];try{const k='rbDia'+today();if(!localStorage.getItem(k)){localStorage.setItem(k,'1');const D=rbData();const pro=arr(S.boletas).filter(b=>isOpen(b)&&b.fechaEstimada===today()).length;const h=new Date().getHours();return [{t:`${h<12?'¡Buenos días':h<19?'¡Buenas tardes':'¡Buenas noches'}${yoNombre()?' '+yoNombre():''}! ${D.B.length} en el taller${pro?`, ${pro} prometida${pro!==1?'s':''} para hoy`:''}${D.atr.length?`, ${D.atr.length} atrasada${D.atr.length!==1?'s':''}`:''}. Tóqueme y le digo qué hacer 💡`,sev:D.atr.length?'a':''}]}}catch(e){}try{alertas().filter(a=>a.sev!=='b').slice(0,6).forEach(a=>{const m=/data-page="([^"]+)"(?:\s+data-id="([^"]*)")?/.exec(a.act||'');L.push({t:String(a.title).replace(/<[^>]+>/g,'')+(a.detail?' · '+String(a.detail).split(' · ')[0]:''),sev:a.sev,go:m?{page:m[1],id:m[2]||undefined}:{page:'alertas'}})})}catch(e){}
  if(!L.length){const ab=arr(S.boletas).filter(isOpen).length;L.push({t:'¡Todo al día! 💪 Tóqueme si necesita algo'},{t:`${ab} máquina${ab!==1?'s':''} en el taller 🔧`})}
  else L.push({t:'¿Le ayudo? Tóqueme y pregúnteme 🙂'});
  if(RB&&RB.f.classList.contains('xmas'))L.push({t:['¡Jo, jo, jo! 🎅 Feliz Navidad','🎄 Que no falten las máquinas listas para Navidad','🎁 ¿Ya revisó lo pendiente antes de las fiestas?'][Math.floor(Math.random()*3)]});
  try{const nm=yoNombre();rbRecs().slice(0,3).forEach(x=>L.splice(1,0,{t:`${nm?nm+', ':''}${x.em} ${x.txt}${x.b?' '+nb(x.b.numero):''}`,sev:x.pr<=2?'a':'',go:x.b?{page:'orden',id:x.b.id}:x.go}))}catch(e){}
  return L}
function rbLoop(ts){if(!RB)return;requestAnimationFrame(rbLoop);if(document.hidden){RB.last=ts;return}
  if(RB.ph!=='fly'&&ts-(RB.last||0)<180)return;if(RB.ph==='fly'&&ts-(RB.last||0)<30)return;
  const dt=Math.min(.2,(ts-(RB.last||ts))/1000);RB.last=ts;const now=Date.now();if(!RB.sz||now-RB.szT>3000){RB.sz=rbSize();RB.szT=now}const {w,h}=RB.sz;const k=w/145;
  if(now-(RB.mT||0)>500){RB.mT=now;const hideM=!!document.querySelector('#modal:not(.hidden)');if(hideM!==RB.away){RB.away=hideM;RB.f.classList.toggle('away',hideM)}}
  if(RB.ph==='fly'){const dx=RB.tx-RB.x,dy=RB.ty-RB.y,d=Math.hypot(dx,dy);const sp=(RB.chat?200:52)*k;
    if(Math.abs(dx)>3)RB.dir=RB.dirLock||(dx>0?1:-1);
    if(d<3){RB.ph=RB.chat?'chat':'work';RB.tPh=now;if(RB.act==='sierra'&&!RB.chat)RB.bot.classList.add('cut')}
    else{const s=Math.min(d,sp*dt);RB.x+=dx/d*s;RB.y+=dy/d*s}}
  else if(RB.ph==='work'){const e=now-RB.tPh,lim=(RB.act==='sierra'?11500:9000)*(RB_LOW?2:1);
    if(RB.act==='sierra'&&e>6500&&!RB.bot.classList.contains('fell'))RB.bot.classList.add('fell');
    if(e>lim){if(RB.act==='sierra'){RB.bot.classList.remove('cut');const bt=RB.bot;setTimeout(()=>bt.classList.remove('fell'),800)}
      if(now>RB.tAct){let n;do{n=RB_ACTS[Math.floor(Math.random()*4)]}while(n===RB.act);rbSetAct(n);RB.tAct=now+rbDur()}
      rbPick();RB.ph='fly'}}
  else if(RB.ph==='chat'){if(!RB.chat){rbPick();RB.ph='fly'}}
  if(RB.phC!==RB.ph){RB.phC=RB.ph;RB.bot.classList.toggle('fly',RB.ph==='fly');RB.bot.classList.toggle('working',RB.ph==='work');RB.bot.classList.toggle('talk',RB.ph==='chat')}
  const tf=`translate(${Math.round(RB.x)}px,${Math.round(RB.y)}px) scaleX(${RB.dir})`;if(tf!==RB.tf){RB.tf=tf;RB.bot.style.transform=tf}
  if(RB.bubOn){if(!RB.bubW)RB.bubW=RB.bub.offsetWidth||200;}const bw=RB.bubW||200;const bx=Math.max(8,Math.min(innerWidth-bw-8,RB.x+w*.5-bw/2)),by=Math.max(60,RB.y-6);if(RB.bubOn){const bt=`translate(${Math.round(bx)}px,${Math.round(by)}px)`;if(bt!==RB.bt){RB.bt=bt;RB.bub.style.transform=bt}}
  if(RB.bubOn&&now>RB.tHide)rbHideBub();
  if(!RB.bubOn&&!RB.chat&&now>RB.tMsg){const L=rbMsgs();rbSay(L[RB.msgI++%L.length])}}

const nom2=()=>yoNombre()?', '+esc(yoNombre()):'';
function rbAnswer(key,q){const D=rbData();const me=norm(yoNombre()),pu=puestoActual();
  const sec=(t,L,f,max)=>L.length?`<div class="rbsec"><div class="rbh">${t} <span>${L.length}</span></div>${rbList(L,f,max)}</div>`:'';
  const dias=b=>daysSince(lastChange(b))+' d';
  switch(key){
  case 'pend':{const n=D.B.length;if(!n)return '¡No hay máquinas en el taller! 🎉';
    const res=[[D.atr,'⏰ atrasada'],[D.det,'⏳ detenida'],[D.esp,'📦 esperando repuesto'],[D.apr,'☎️ esperando aprobación'],[D.lis,'✅ lista para entregar'],[D.sinT,'👤 sin técnico'],[D.sinR,'📥 sin recibir en el taller']].filter(([L])=>L.length).map(([L,t])=>`<div>${t.split(' ')[0]} <b>${L.length}</b> ${t.split(' ').slice(1).join(' ')}${L.length!==1?'s':''}</div>`.replace('esperandos','esperando').replace('sin técnicos','sin técnico').replace('sin recibirs','sin recibir').replace(/sin recibir en el tallers/,'sin recibir en el taller')).join('');
    const pp=arr(S.porpedir).length;
    const urg=[...D.atr,...D.det.filter(b=>!D.atr.includes(b))].slice(0,5);
    return `Hay <b>${n}</b> máquina${n!==1?'s':''} en el taller.${res?`<div class="rbsum">${res}${pp?`<div>🛒 <b>${pp}</b> repuesto${pp!==1?'s':''} por pedir</div>`:''}</div>`:''}${urg.length?`<div class="rbh" style="margin-top:8px">Lo más urgente</div>${urg.map(b=>rbOL(b,D.atr.includes(b)?'⏰ prometida '+fdate(b.fechaEstimada):'⏳ '+dias(b)+' sin avanzar')).join('')}`:'<div style="margin-top:6px">Nada atrasado ni detenido 👍</div>'}`}
  case 'mio':{if(pu==='recepcion'){const lr=D.lis.filter(b=>!b.recepRecibio),le=D.lis.filter(b=>b.recepRecibio);
      return (sec('📥 Recibir del taller',lr)+sec('🤝 Entregar al cliente',le,dias)+sec('☎️ Llamar para aprobación',D.apr,dias)+sec('📦 Seguir el repuesto',D.esp,dias))||'No tiene nada pendiente ahora mismo 👍'}
    const L=D.B.filter(b=>norm(b.tecnico)===me&&b.estado!=='Listo para entregar').sort((a,z)=>(a.prioridad==='Urgente'?0:1)-(z.prioridad==='Urgente'?0:1)||String(a.fechaEstimada||'9').localeCompare(String(z.fechaEstimada||'9')));
    const nuevas=D.sinR;
    return (me?'':'Elija su usuario para saber qué le toca. ')+(sec('🔧 Asignadas a usted',L,b=>b.estado+(b.fechaEstimada?' · '+fdate(b.fechaEstimada):''),8)+sec('📥 Nuevas sin recibir en el taller',nuevas)+sec('👤 Sin técnico',D.sinT))||'No tiene máquinas asignadas 👍'}
  case 'atras':return D.atr.length?sec('⏰ Atrasadas',D.atr,b=>'prometida '+fdate(b.fechaEstimada),10):'No hay máquinas atrasadas 👍';
  case 'deten':{const L=[...D.det,...D.esp.filter(b=>daysSince(lastChange(b))>=1),...D.lis.filter(b=>daysSince(lastChange(b))>=num(CFG.diasRetiro))];return L.length?sec('⏳ Sin avanzar',D.det,b=>dias(b)+' · '+b.estado)+sec('📦 Esperando repuesto',D.esp,dias)+sec('✅ Listas sin retirar',D.lis.filter(b=>daysSince(lastChange(b))>=num(CFG.diasRetiro)),dias):'No hay máquinas detenidas 👍'}
  case 'rep':{const pp=arr(S.porpedir);const low=arr(S.repuestos).filter(r=>stockSt(r).k!=='ok');const pe=arr(S.pedidos).filter(p=>p.estado==='Pedido');
    if(!pp.length&&!low.length&&!pe.length&&!D.esp.length)return 'No falta ningún repuesto 👍';
    return `${pp.length?`<div class="rbsec"><div class="rbh">🛒 Por pedir <span>${pp.length}</span></div>${pp.slice(0,8).map(x=>`<a class="rbl" data-act="nav" data-page="pedidos">${esc(x.nombre||'')}${x.cant?' × '+x.cant:''}${x.boletaId&&S.boletas[x.boletaId]?` <span>${nb(S.boletas[x.boletaId].numero)}</span>`:''}</a>`).join('')}</div>`:''}
     ${low.length?`<div class="rbsec"><div class="rbh">📉 Bajo el mínimo <span>${low.length}</span></div>${low.slice(0,6).map(r=>`<a class="rbl" data-act="open" data-page="repuesto" data-id="${r.id}">${esc(r.nombre)} <span>quedan ${num(r.stock)}</span></a>`).join('')}</div>`:''}
     ${pe.length?`<div class="rbsec"><div class="rbh">🚚 Pedidos sin llegar <span>${pe.length}</span></div>${pe.slice(0,5).map(p=>`<a class="rbl" data-act="nav" data-page="pedidos">${esc(p.proveedor||'Proveedor')} <span>hace ${daysSince(iso(new Date(p.fecha)))} d</span></a>`).join('')}</div>`:''}
     ${sec('⏸️ Máquinas esperando repuesto',D.esp,dias)}`}
  case 'reparar':{const L=D.B.filter(b=>b.estado!=='Listo para entregar');if(!L.length)return `¡No hay máquinas por reparar${nom2()}! 🎉`;
    const ord=x=>x.sort((a,z)=>(a.prioridad==='Urgente'?0:1)-(z.prioridad==='Urgente'?0:1)||String(a.fechaEstimada||'9').localeCompare(String(z.fechaEstimada||'9'))||String(a.fechaIngreso).localeCompare(String(z.fechaIngreso)));
    const ex=b=>[b.prioridad==='Urgente'?'🔥 urgente':'',b.tecnico?'🔧 '+b.tecnico:'👤 sin técnico',b.fechaEstimada?(b.fechaEstimada<today()?'⏰ ':'📆 ')+fdate(b.fechaEstimada):daysSince(b.fechaIngreso)+' d'].filter(Boolean).join(' · ');
    const sinE=ord(L.filter(b=>['Recibido','En diagnóstico'].includes(b.estado))),enR=ord(L.filter(b=>['En reparación','Control de calidad'].includes(b.estado))),esp=ord(L.filter(b=>['Esperando repuestos','Esperando aprobación'].includes(b.estado)));
    return `Hay <b>${L.length}</b> máquina${L.length!==1?'s':''} por reparar${D.lis.length?` (y ${D.lis.length} ya lista${D.lis.length!==1?'s':''} para entregar)`:''}:`+sec('🆕 Sin empezar',sinE,ex,8)+sec('🔧 En reparación',enR,ex,8)+sec('⏸️ Esperando repuesto o aprobación',esp,b=>b.estado.replace('Esperando ','esperando ')+' · '+daysSince(lastChange(b))+' d',8)}
  case 'listas':return D.lis.length?sec('✅ Listas para entregar',D.lis,b=>(b.recepRecibio?'en recepción · ':'en el taller · ')+dias(b),10):'No hay máquinas listas ahora mismo.';
  case 'hoy':{const t=today(),A=arr(S.boletas);const en=A.filter(b=>b.fechaIngreso===t),ent=A.filter(b=>b.estado==='Entregado'&&String(b.fechaEntrega||'').slice(0,10)===t);
    const lis=A.filter(b=>(b.historial||[]).some(h=>h.estado==='Listo para entregar'&&iso(new Date(h.t))===t)&&b.estado==='Listo para entregar');
    return `<div class="rbsum"><div>📥 Entraron <b>${en.length}</b></div><div>✅ Quedaron listas <b>${lis.length}</b></div><div>🤝 Se entregaron <b>${ent.length}</b></div><div>🔧 En el taller <b>${D.B.length}</b></div></div>${sec('📥 Entraron hoy',en)}`}
  case 'diag':return `Cuénteme la falla y la máquina, por ejemplo <i>"MS 250 no arranca"</i>, <i>"bomba no tira presión"</i> o <i>"desbrozadora pierde potencia"</i>. Le digo qué fue en casos parecidos de su taller y qué revisar primero.<div class="rbchips">${['no arranca','pierde potencia','se apaga','echa humo','fuga','bomba sin presión','no corta'].map(x=>`<button type="button" class="rbc" data-rbq="${x}">${x}</button>`).join('')}</div>`;
  case 'ayuda':return `Pregúnteme cómo se hace algo, por ejemplo <i>"¿cómo recibo una máquina?"</i>, <i>"¿cómo imprimo etiquetas?"</i> o <i>"¿cómo uso el cronómetro?"</i>.<div class="rbchips">${['recibir','entregar','plantilla','etiquetas','cronómetro','respaldo','encuesta','3D','fichas','pedidos'].map(x=>`<button type="button" class="rbc" data-rbq="¿cómo ${x}?">${x}</button>`).join('')}</div>`;
  }
  if(key==='recs')return rbRecsHTML(8)||'Todo está al día. ¡Buen trabajo! 💪';
  // texto libre
  const n=rbFix(norm(q||'').replace(/[¿?¡!.,;:]/g,' ').replace(/\s+/g,' ').trim());if(!n)return '';
  {const x=rbBrain(n,D);if(x)return x}
  const nom=esc(yoNombre()||'');
  if(/recomiend|suger|que hago|que sigue|que debo|que ocupo|que necesito|ayudame|ayudeme|por donde empiezo|que me falta|en que trabajo/.test(n))return rbRecsHTML(8)||`Todo está al día${nom?', '+nom:''}. ¡Buen trabajo! 💪`;
  {const x=rbSmart(n,D);if(x)return x}
  if(/^(hola|buen|hey|que tal)/.test(n))return `¡Hola${yoNombre()?' '+esc(yoNombre()):''}! 👋 Soy el asistente del taller. Pregúnteme lo que está pendiente o cómo se hace algo.`;
  if(/gracias/.test(n))return '¡Con mucho gusto! 🤖💚';
  if(/^(como|donde|ayuda|que hago|como se)/.test(n)||/\bcomo\b/.test(n)){const h=RB_HELP.find(([re])=>re.test(n));if(h)return h[1];return rbAnswer('ayuda')}
  if(/pendient|falta|que hay|como vamos|resumen/.test(n)&&!/repuest/.test(n))return rbAnswer('pend');
  if(/atras|vencid|tarde|prometid/.test(n))return rbAnswer('atras');
  if(/repuest|pedir|stock|agotad|inventar/.test(n))return rbAnswer('rep');
  if(/detenid|olvid|parad|abandon|sin avanzar/.test(n))return rbAnswer('deten');
  if(/list|entreg|retir/.test(n))return rbAnswer('listas');
  if(/\bmi\b|\bmis\b|mio|mia|asignad|me toca|tengo/.test(n))return rbAnswer('mio');
  if(/\bhoy\b/.test(n))return rbAnswer('hoy');
  if(/pagina web|pagina del taller|sitio web|\bweb\b/.test(n))return `🌐 La página del taller se configura en <b>Configuración → Página web del taller</b>.${FB_MODE?`<a class="rbl" href="${esc(webUrl())}" target="_blank" rel="noopener">Abrir la página ›</a>`:''}`;
  if(/estadistic|grafic|numeros del taller/.test(n))return 'Las gráficas del taller están en <b>Estadísticas</b>.<a class="rbl" data-act="nav" data-page="numeros">📊 Abrir Estadísticas ›</a>';
  if(/garant/.test(n)){const G=D.B.filter(b=>{const p=prevInfo(b);return p&&p.enGar});return G.length?sec('🛡️ En garantía',G):'No hay máquinas abiertas en garantía 👍'}
  {const h=RB_HELP.find(([re])=>re.test(n));const m=/\b(\d{1,6})\b/.exec(n);
   if(m){const b=arr(S.boletas).find(x=>num(x.numero)===num(m[1]));if(b){const e=eq(b.equipoId)||{};return `${rbOL(b)}<div class="rbsum"><div>Estado: <b>${esc(b.estado)}</b></div>${b.tecnico?`<div>Técnico: <b>${esc(b.tecnico)}</b></div>`:''}<div>Recibida ${fdate(b.fechaIngreso)}${isOpen(b)?` · ${daysSince(b.fechaIngreso)} días en el taller`:''}</div>${b.fechaEstimada?`<div>Prometida: ${fdate(b.fechaEstimada)}</div>`:''}${b.diagnostico?`<div>Diagnóstico: ${esc(b.diagnostico)}</div>`:''}</div>`}}
   const C=arr(S.clientes).filter(c=>norm(c.nombre).includes(n)||String(c.telefono||'').replace(/\D/g,'').includes(n.replace(/\D/g,'')||'@@'));
   const E=arr(S.equipos).filter(e=>[e.serie,e.modelo,e.marca].some(v=>v&&norm(v).includes(n)));
   const O=arr(S.boletas).filter(b=>C.some(c=>c.id===b.clienteId)||E.some(e=>e.id===b.equipoId)).sort((a,z)=>(isOpen(z)?1:0)-(isOpen(a)?1:0)||String(z.fechaIngreso).localeCompare(String(a.fechaIngreso)));
   if(O.length)return `Encontré esto:${rbList(O,b=>b.estado,8)}`;
   if(h)return h[1]}
  if(/maquina|orden|trabajo|equipo|taller/.test(n))return rbAnswer('reparar');
  const rc=rbRecsHTML(4);
  return `No estoy seguro de qué busca${yoNombre()?', '+esc(yoNombre()):''} 🤔. Pruebe con un número de orden, un cliente, un repuesto o <i>"¿cómo…?"</i>.${rc?`<div class="rbh" style="margin-top:8px">Mientras tanto, esto es lo que yo haría:</div>${rc}`:''}`}

/* ---------- recomendaciones e inteligencia del asistente ---------- */
function rbRecs(){const D=rbData(),me=norm(yoNombre()),pu=puestoActual(),adm=adminReal()||pu==='ambos';const T=pu!=='recepcion'||adm,Rc=pu!=='taller'||adm;const R=[];const t=today();
  const add=(pr,em,txt,b,go)=>R.push({pr,em,txt,b,go});
  if(T){const mias=D.B.filter(b=>norm(b.tecnico)===me&&b.estado!=='Listo para entregar');
    D.esp.filter(b=>norm(b.tecnico)===me||adm).forEach(b=>{const h=b.historial||[];const iE=h.map(x=>x.estado).lastIndexOf('Esperando repuestos');if(h.slice(Math.max(0,iE)).some(x=>/^Llegó repuesto/.test(x.nota||''))&&!arr(S.porpedir).some(x=>x.boletaId===b.id))add(1,'📦','Ya llegó el repuesto: siga con',b)});
    mias.filter(b=>b.prioridad==='Urgente').forEach(b=>add(2,'🔥','Urgente: trabaje en',b));
    mias.filter(b=>b.fechaEstimada&&b.fechaEstimada<=t).forEach(b=>add(2,'⏰',b.fechaEstimada<t?'Atrasada, prometida '+fdate(b.fechaEstimada)+':':'Se prometió para hoy:',b));
    D.sinR.slice(0,2).forEach(b=>add(3,'📥','Reciba en el taller la nueva',b));
    D.det.filter(b=>norm(b.tecnico)===me||(!b.tecnico&&T)).slice(0,2).forEach(b=>add(4,'⏳',`Lleva ${daysSince(lastChange(b))} días sin avanzar:`,b));
    D.B.filter(b=>b.crono&&b.crono.t0&&Date.now()-num(b.crono.t0)>8*36e5).forEach(b=>add(3,'⏱️','¿Se le olvidó el cronómetro? Sigue corriendo en',b));
    if(!mias.length&&D.sinT.length)add(5,'👤','Tome una sin técnico:',D.sinT[0])}
  if(Rc){D.lis.filter(b=>!b.recepRecibio).slice(0,2).forEach(b=>add(2,'📥','Reciba del taller la que está lista:',b));
    D.lis.filter(b=>b.recepRecibio&&daysSince(lastChange(b))>=num(CFG.diasRetiro)).slice(0,2).forEach(b=>add(daysSince(lastChange(b))>=(num(CFG.diasAbandono)||30)?2:4,'💬',`Recuérdele al cliente (lleva ${daysSince(lastChange(b))} días lista):`,b));
    D.apr.filter(b=>daysSince(lastChange(b))>=num(CFG.diasAprob)).slice(0,2).forEach(b=>add(3,'☎️','Llame al cliente para la aprobación de',b));
    const pp=arr(S.porpedir).length;if(pp)add(4,'🛒',`Hay ${pp} repuesto${pp!==1?'s':''} por pedir al proveedor`,null,{page:'pedidos'});
    arr(S.boletas).filter(b=>b.estado!=='Entregado'&&b.estado!=='Cancelado'&&b.fechaEstimada===t&&b.estado==='Listo para entregar').slice(0,2).forEach(b=>add(3,'📆','Se prometió para hoy y ya está lista, avise:',b))}
  if(adm){try{if(respaldoPend())add(4,'💾','Toca hacer el respaldo',null,{page:'respaldo'})}catch(e){}
    const low=arr(S.repuestos).filter(r=>stockSt(r).k==='out').length;if(low)add(6,'📉',`${low} repuesto${low!==1?'s':''} agotado${low!==1?'s':''}`,null,{page:'repuestos'});
    arr(S.boletas).filter(b=>{const e=encDe(b);return e&&num(e.s)<=2&&Date.now()-num(e.t)<14*864e5}).slice(0,2).forEach(b=>add(3,'⭐','Cliente poco satisfecho, llámelo:',b))}
  const seen=new Set();return R.filter(x=>{const k=x.b?x.b.id:x.txt;if(seen.has(k))return false;seen.add(k);return true}).sort((a,z)=>a.pr-z.pr)}
function rbRecsHTML(max,intro){const L=rbRecs().slice(0,max||6);if(!L.length)return '';
  return `${intro?'<div class="rbh" style="margin-top:6px">💡 Le recomiendo:</div>':''}${L.map(x=>x.b?`<div class="rbrec">${x.em} ${esc(x.txt)}</div>${rbOL(x.b)}`:`<a class="rbl" data-act="nav" data-page="${x.go.page}">${x.em} ${esc(x.txt)} <span>›</span></a>`).join('')}`}
const RB_STOP=new Set('el la los las un una unos unas de del al a en y o que hay tengo tiene tenemos quedan queda cuanto cuantos cuantas cuanta me mi mis su sus por para con sin es son esta estan cual cuales donde como se lo le les hay ya stock existencia inventario repuesto repuestos busca buscar quiero saber dime digame favor porfa porfavor'.split(' '));
const rbWords=n=>n.split(' ').filter(w=>w.length>2&&!RB_STOP.has(w));
function rbSmart(n,D){const sec=(t,L,f,max)=>L.length?`<div class="rbsec"><div class="rbh">${t} <span>${L.length}</span></div>${rbList(L,f,max)}</div>`:'';
  const W=rbWords(n);const has=re=>re.test(n);const t=today();const man=iso(new Date(Date.now()+864e5));
  // entregas prometidas
  if(has(/(entrega|promet|prometi|sale|salen).*(hoy|manana|semana)|(hoy|manana|semana).*(entrega|promet)/)){const d=has(/manana/)?man:t;
    let L=arr(S.boletas).filter(b=>isOpen(b)&&b.fechaEstimada);if(has(/semana/)){const e=iso(new Date(Date.now()+7*864e5));L=L.filter(b=>b.fechaEstimada>=t&&b.fechaEstimada<=e)}else L=L.filter(b=>b.fechaEstimada===d);
    return L.length?sec(`📆 Prometidas para ${has(/semana/)?'esta semana':has(/manana/)?'mañana':'hoy'}`,L.sort((a,z)=>a.fechaEstimada.localeCompare(z.fechaEstimada)),b=>b.estado+' · '+fdate(b.fechaEstimada),10):`No hay entregas prometidas para ${has(/semana/)?'esta semana':has(/manana/)?'mañana':'hoy'}.`}
  // técnicos / carga
  if(has(/tecnic|mecanic|quien tiene|carga|trabajo tiene|cuantas hizo|cuantas lleva|rendimiento|productiv/)){const ym=t.slice(0,7);const M={};
    arr(S.boletas).forEach(b=>{const k=b.tecnico||'Sin asignar';const o=M[k]||(M[k]={a:0,e:0,h:0});if(isOpen(b)&&b.estado!=='Listo para entregar')o.a++;if(b.estado==='Entregado'&&String(b.fechaEntrega||'').slice(0,7)===ym)o.e++;(b.manoObra||[]).forEach(m=>{if(iso(new Date(num(m.t)||Date.now())).slice(0,7)===ym)o.h+=num(m.h)})});
    const L=Object.entries(M).filter(([k,o])=>o.a||o.e||o.h).sort((a,z)=>z[1].a-a[1].a);if(!L.length)return 'Todavía no hay trabajos asignados.';
    return `<div class="rbh">🔧 Técnicos</div><div class="rbtab">${L.map(([k,o])=>`<div><b>${esc(k)}</b><span>${o.a} en proceso · ${o.e} entregadas este mes · ${fh(o.h)}</span></div>`).join('')}</div>`}
  // calificaciones
  if(has(/calific|encuest|satisf|estrella|opinion|reseña|resena/)){const E=Object.values(S.encuestas||{});if(!E.length)return 'Todavía no hay calificaciones de clientes. Llegan cuando se entrega una máquina y el cliente abre el enlace.';
    const avg=(E.reduce((a,e)=>a+num(e.s),0)/E.length).toFixed(1);const last=E.sort((a,z)=>num(z.t)-num(a.t)).slice(0,4);
    return `⭐ Promedio <b>${avg}</b> de 5 con <b>${E.length}</b> calificaci${E.length!==1?'ones':'ón'}.${last.map(e=>`<div class="rbl" style="white-space:normal">${estrellas(num(e.s))} <span>${esc(e.n||'')}</span>${e.c?`<div style="margin-top:2px">“${esc(e.c)}”</div>`:''}</div>`).join('')}`}
  // mes

const fmtDur=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`};
function cronoBar(b,can){const c=b.crono;if(!c&&!(can&&esTaller()))return '';
  return `<div class="crono ${c&&c.t0?'on':''}"><span class="crd">⏱️</span><b class="mono" data-crono="${c&&c.t0?c.t0:0}" data-acc="${c?num(c.acc):0}">${fmtDur(c?num(c.acc):0)}</b><span class="small muted ell" style="flex:1;min-width:0">${c?`${esc(c.tec||'')}${c.t0?' · trabajando':' · en pausa'}`:'Cronómetro: llena las horas solo'}</span>
   ${can&&esTaller()?(c?`${c.t0?`<button class="btn sm" data-act="crPause" data-id="${b.id}">⏸️ Pausar</button>`:`<button class="btn sm" data-act="crGo" data-id="${b.id}">▶️ Seguir</button>`}<button class="btn sm p" data-act="crStop" data-id="${b.id}">⏹️ Terminar</button>`:`<button class="btn sm p" data-act="crGo" data-id="${b.id}">▶️ Iniciar</button>`):''}</div>`}
setInterval(()=>{document.querySelectorAll('[data-crono]').forEach(el=>{const t0=num(el.dataset.crono);if(t0)el.textContent=fmtDur(num(el.dataset.acc)+Date.now()-t0)})},1000);
async function crGo(id){let b=S.boletas[id];if(!b)return;const c=b.crono;const me=yoNombre()||quien();
  if(c&&c.t0)return;if(c&&c.tec&&norm(c.tec)!==norm(me)&&!isAdmin())return toast(`El cronómetro es de ${c.tec}`);
  await put('boletas',{...b,crono:{tec:c?c.tec:me,acc:c?num(c.acc):0,t0:Date.now()}});render()}
async function crPause(id){const b=S.boletas[id];if(!b||!b.crono||!b.crono.t0)return;await put('boletas',{...b,crono:{...b.crono,acc:cronoMs(b.crono),t0:0}});render()}
let CR=null;
function crStop(id){const b=S.boletas[id];if(!b||!b.crono)return;const ms=cronoMs(b.crono);const h=Math.round(ms/9e5)/4;
  CR={id,ms,h,c:'',nota:''};crRender()}
function crRender(){const L=CAT().manoObra;
  openModal('⏹️ Terminar cronómetro',`<div style="text-align:center;margin-bottom:12px"><div class="mono" style="font-size:34px;font-weight:800">${fmtDur(CR.ms)}</div><div class="small muted">tiempo trabajado</div></div>
   <div class="f"><label>¿Qué trabajo fue?</label><div class="cp">${L.map(x=>`<button type="button" class="cpc ${CR.c===x.c?'on':''}" data-act="crC" data-c="${esc(x.c)}">${moEm(x.d)} ${esc(x.d)}</button>`).join('')}</div></div>
   <div class="fr"><div class="f"><label>Horas a anotar</label><input id="crH" type="number" min="0" step="0.25" value="${CR.h}"></div><div class="f"><label>Nota <span class="opt">(opcional)</span></label><input id="crN" value="${esc(CR.nota)}" autocomplete="off"></div></div>`,
   `<button class="btn" data-act="crDiscard">🗑️ Descartar tiempo</button><span class="sp"></span><button class="btn" data-act="close">Seguir después</button><button class="btn p" data-act="crSave" ${CR.c?'':'disabled'}>${ic('check')} Anotar en mano de obra</button>`,'sm');
  $('#crH').oninput=e=>CR.h=e.target.value;$('#crN').oninput=e=>CR.nota=e.target.value}
async function crSave(){const b=S.boletas[CR.id];if(!b)return;const x=CAT().manoObra.find(m=>m.c===CR.c);if(!x)return toast('Elija el trabajo');const h=Math.max(0,Math.round(num(CR.h)*100)/100);
  const tec=(b.crono&&b.crono.tec)||quien();
  const nb2={...b,crono:null,manoObra:[...(b.manoObra||[]),{id:uid(),c:x.c,d:x.d,h,tec,nota:['⏱️ Cronómetro '+fmtDur(CR.ms),CR.nota.trim()].filter(Boolean).join(' · '),por:quien(),t:Date.now()}],historial:[...(b.historial||[]),{t:Date.now(),estado:b.estado,nota:`Mano de obra (cronómetro): ${x.d} · ${fh(h)}`,por:quien(),dev:DEV}]};
  if(await put('boletas',nb2)){CR=null;closeModal();render();toast('⏱️ Horas anotadas')}}

/* ================== Avisos repetidos de máquinas detenidas ================== */
const NAGK='tallerNag';
function nagCheck(){try{
  const hrs=CFG.nagHoras==null?3:num(CFG.nagHoras);if(!hrs||!WHO&&!fbName())return;
  const me=norm(yoNombre()),pu=puestoActual(),adm=adminReal()||pu==='ambos';const T=pu!=='recepcion'||adm,Rc=pu!=='taller'||adm;
  let st={};try{st=JSON.parse(localStorage.getItem(NAGK)||'{}')}catch(e){}
  const fresh=!sessionStorage.getItem('nagSes');sessionStorage.setItem('nagSes','1');
  const now=Date.now(),due=(k,min)=>{const l=num(st[k]);return now-l>=hrs*36e5||(fresh&&now-l>=36e5)};
  const out=[];
  arr(S.boletas).filter(isOpen).forEach(b=>{const lc=daysSince(lastChange(b));const mine=!b.tecnico||norm(b.tecnico)===me;const e=eq(b.equipoId),c=cli(b.clienteId)||{};const who=`${nb(b.numero)} · ${eqShort(e)} · ${c.nombre||''}`;
    if(b.crono&&b.crono.t0)return;
    let k=null,t='',d='';
    if(b.estado==='Esperando repuestos'){const h=(b.historial||[]);const iE=h.map(x=>x.estado).lastIndexOf('Esperando repuestos');const ya=h.slice(Math.max(0,iE)).some(x=>/^Llegó repuesto/.test(x.nota||''));
      const pend=arr(S.porpedir).some(x=>x.boletaId===b.id);
      if(ya&&!pend){if(T&&(mine||adm)){k='llego';t='📦 Ya llegó el repuesto · siga con la reparación';d=who}}
      else if(lc>=1&&(Rc||mine)){k='detenida';t=`⏳ Sigue esperando repuesto · ${lc} día${lc!==1?'s':''}`;d=who+' · ¿Ya se pidió? ¿Cuándo llega?'}}
    else if(b.estado==='Esperando aprobación'&&lc>=num(CFG.diasAprob)&&Rc){k='detenida';t=`⏳ Esperando que el cliente apruebe · ${lc} días`;d=who+' · llame o escriba al cliente'}
    else if(b.estado==='Listo para entregar'){if(Rc&&lc>=num(CFG.diasRetiro)){k='detenida';t=lc>=(num(CFG.diasAbandono)||30)?`📦 Máquina abandonada · ${lc} días sin retirar`:`⏳ Lista sin retirar · ${lc} días`;d=who+' · recuérdele al cliente'}}
    else if(lc>=num(CFG.diasSinMov)&&T&&(mine||adm)){k='detenida';t=`⏳ Máquina olvidada · ${lc} días sin avanzar`;d=who+' · '+b.estado+(b.tecnico?' · 🔧 '+b.tecnico:'')}
    if(k&&due(b.id))out.push({id:b.id,k,t,d})});
  if(!out.length)return;
  out.forEach(x=>st[x.id]=now);localStorage.setItem(NAGK,JSON.stringify(st));
  if(out.length<=3)out.forEach((x,i)=>setTimeout(()=>ping(x.t,x.d,x.id,x.k),i*700));
  else ping(`⏳ ${out.length} máquinas detenidas`,out.slice(0,4).map(x=>x.d.split(' · ').slice(0,2).join(' ')).join(' · ')+(out.length>4?'…':''),()=>go({page:'alertas'}),'detenida');
}catch(e){console.warn('nag',e)}}
setTimeout(()=>{nagCheck();setInterval(nagCheck,10*60e3)},25000);

/* ================== Copia automática en la nube ================== */
let NUBE=null;
async function nubeList(){if(!FB_MODE||!DB)return [];const s=await DB.collection('respaldos').get();NUBE=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,z)=>num(z.t)-num(a.t));return NUBE}
async function nubeHacer(manual){if(!FB_MODE||!DB)return false;
  const data=JSON.stringify({version:2,exportado:new Date().toISOString(),nube:true,config:CFG,catalogo:CATD,...Object.fromEntries(COLS.map(c=>[c,S[c]]))});
  const id='R'+today()+(manual?'-'+new Date().toTimeString().slice(0,5).replace(':',''):'');const CH=250000;const parts=Math.ceil(data.length/CH);
  for(let i=0;i<parts;i++)await DB.collection('respaldoPartes').doc(id+'_'+i).set({d:data.slice(i*CH,(i+1)*CH)});
  await DB.collection('respaldos').doc(id).set({t:Date.now(),por:quien(),partes:parts,tam:data.length,n:arr(S.boletas).length});
  const L=await nubeList();for(const o of L.slice(4)){for(let i=0;i<num(o.partes);i++)await DB.collection('respaldoPartes').doc(o.id+'_'+i).delete();await DB.collection('respaldos').doc(o.id).delete()}
  await nubeList();return true}
async function nubeAuto(){try{if(!FB_MODE||!DB||!arr(S.boletas).length)return;const L=await nubeList();if(L[0]&&Date.now()-num(L[0].t)<7*864e5)return;await nubeHacer(false)}catch(e){console.warn('nube',e)}}
if(typeof FB_MODE!=='undefined'&&FB_MODE)setTimeout(()=>{nubeAuto();setInterval(nubeAuto,6*36e5)},40000);
async function nubeLeer(id){const o=(NUBE||[]).find(x=>x.id===id);if(!o)return null;let s='';for(let i=0;i<num(o.partes);i++){const d=await DB.collection('respaldoPartes').doc(id+'_'+i).get();s+=(d.data()||{}).d||''}return s}
function nubeCard(){if(!FB_MODE)return '';if(!NUBE){nubeList().then(()=>render()).catch(()=>{});}
  const L=NUBE||[];return `<div class="card"><div class="ch"><h2><span class="hem">☁️</span> Copia automática en la nube</h2>${isAdmin()?`<button class="btn sm" data-act="nubeNow">☁️ Copiar ahora</button>`:''}</div><div class="cp-in">
   <p class="small muted" style="margin-top:0">Cada semana se guarda sola una copia de todo, sin hacer nada. Se guardan las últimas 4. Sirve si algo se borra por error.</p>
   ${L.length?`<div class="rows">${L.map(o=>`<div class="rw" style="cursor:default"><div class="ticon" style="width:36px;height:36px;font-size:18px">☁️</div><div class="mn"><div class="t">${new Date(num(o.t)).toLocaleDateString('es-CR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} · ${new Date(num(o.t)).toLocaleTimeString('es-CR',{hour:'numeric',minute:'2-digit'})}</div><div class="s">${num(o.n)} órdenes · ${Math.round(num(o.tam)/1024)} KB${o.por?' · '+esc(o.por):''}</div></div>${isAdmin()?`<button class="btn sm" data-act="nubeDl" data-id="${o.id}">${ic('dl')}</button><button class="btn sm" data-act="nubeRest" data-id="${o.id}">♻️ Restaurar</button>`:''}</div>`).join('')}</div>`:`<p class="small muted" style="margin:0">${NUBE?'Todavía no hay copias. La primera se hace sola en unos segundos.':'Cargando…'}</p>`}</div></div>`}
/* ================== Código de barras (Code 128-B) ================== */
const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128svg(txt,h=40){txt=String(txt).replace(/[^\x20-\x7e]/g,'');const v=[104];for(const ch of txt)v.push(ch.charCodeAt(0)-32);let ck=104;v.slice(1).forEach((x,i)=>ck+=x*(i+1));v.push(ck%103,106);
  let x=10,bars='';v.forEach(c=>{const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}});const W=x+10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><rect width="${W}" height="${h}" fill="#fff"/><g fill="#000">${bars}</g></svg>`}
function codGen(){const used=new Set(arr(S.repuestos).map(r=>r.codBarras).filter(Boolean));let c;do{c='TL'+String(Date.now()).slice(-7)+String(Math.floor(Math.random()*90+10))}while(used.has(c));return c}
let ETQ=null;
function etiquetasModal(ids){
  const all=arr(S.repuestos).sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre)));
  ETQ={sel:Object.fromEntries((ids||[]).map(id=>[id,1])),q:'',size:ETQ?.size||'m'};etqRender(all);
}
function etqRender(all){all=all||arr(S.repuestos).sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre)));const q=norm(ETQ.q);const L=all.filter(r=>!q||norm([r.nombre,r.sku,r.codBarras,r.codProv].join(' ')).includes(q)).slice(0,200);

  <div class="calg">${days.map(d=>{const L=B.filter(b=>b.fechaEstimada===d&&b.estado!=='Entregado');const E=B.filter(b=>b.estado==='Entregado'&&String(b.fechaEntrega||'').slice(0,10)===d);

  ${sinF?`<p class="small muted" style="margin-top:12px">📌 ${sinF} orden${sinF!==1?'es':''} abierta${sinF!==1?'s':''} sin fecha de entrega prometida. Se pone en cada orden, en el trabajo del taller (“Entrega prometida”).</p>`:''}`;

function qrData(text,size){
  if(typeof QRCode==='undefined')return '';
  const d=document.createElement('div');d.style.cssText='position:absolute;left:-9999px';document.body.appendChild(d);
  try{new QRCode(d,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});const c=d.querySelector('canvas');const u=c?c.toDataURL('image/png'):(d.querySelector('img')||{}).src||'';d.remove();return u}catch(e){d.remove();return ''}
}

function openDoc(name,html){
  if(DL)return saveFile(name,html); // dentro de Claude: se descarga y al abrirlo aparece la ventana de impresión
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';

 garantias:{t:'Regresos por garantía',i:'shield',d:'Máquinas que volvieron dentro de la garantía, y de qué técnico era el trabajo anterior.',build(){

 satisf:{t:'Satisfacción de clientes',i:'star',d:'Calificaciones que dejaron los clientes al recibir su máquina.',build(){
   const L=arr(S.boletas).filter(b=>encDe(b)&&inRange(b.fechaIngreso)).map(b=>({b,e:encDe(b)}));const n=L.length,avg=n?Math.round(L.reduce((a,x)=>a+num(x.e.s),0)/n*10)/10:0;
   const tc={};L.forEach(({b,e})=>{const k=b.tecnico||'Sin asignar';const o=tc[k]||(tc[k]=[0,0]);o[0]++;o[1]+=num(e.s)});
   return [{title:`Promedio: ${n?avg+' ★':'—'} · ${n} calificaci${n!==1?'ones':'ón'}`,head:['Estrellas','Cantidad'],num:[1],rows:[5,4,3,2,1].map(s=>[estrellas(s),L.filter(x=>num(x.e.s)===s).length])},{title:'Por técnico',head:['Técnico','Calificaciones','Promedio'],num:[1,2],rows:Object.entries(tc).map(([k,[c,sum]])=>[k,c,Math.round(sum/c*10)/10])},{title:'Detalle',head:['Fecha','Orden','Cliente','Técnico','Estrellas','Comentario'],num:[],rows:L.sort((a,z)=>num(z.e.t)-num(a.e.t)).map(({b,e})=>[fdate(iso(new Date(num(e.t)))),nb(b.numero),cli(b.clienteId)?.nombre||'',b.tecnico||'',estrellas(num(e.s)),e.c||''])}]}},
 modelos:{t:'Fallas por marca y modelo',i:'tractor',d:'Qué falla más en cada marca y modelo, y qué repuestos y trabajos se usan.',build(){
   const g={};arr(S.boletas).filter(b=>b.estado!=='Cancelado'&&inRange(b.fechaIngreso)).forEach(b=>{const e=eq(b.equipoId);if(!e||!e.marca)return;const k=modKey(e);const o=g[k]||(g[k]={nm:[e.marca,e.modelo].filter(Boolean).join(' '),tipo:e.tipo||'',bs:[]});o.bs.push(b)});
   const top=L=>{const m={};L.forEach(x=>{if(x)m[x]=(m[x]||0)+1});const t=Object.entries(m).sort((a,b)=>b[1]-a[1]);return t.slice(0,3).map(([k,v])=>`${k} (${v})`).join(', ')};
